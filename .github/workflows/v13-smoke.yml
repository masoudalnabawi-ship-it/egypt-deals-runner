name: V13 Smoke

on:
  push:
    branches:
      - v13-rebuild
    paths:
      - "deals_v13/**"
      - "tests/v13/**"
      - "scripts/run_v13.py"
      - "requirements-v13.txt"
      - ".github/workflows/v13-smoke.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-v13.txt
      - run: PYTHONPATH=. python -m unittest discover -s tests/v13 -p 'test_*.py' -v
      - run: python -m py_compile $(find deals_v13 -name '*.py' -type f) scripts/run_v13.py
