name: Egypt Deals Scan

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: egypt-deals-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUD_API_URL: ${{ secrets.CLOUD_API_URL }}
      CLOUD_API_KEY: ${{ secrets.CLOUD_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_MEDIA_STAGE_CHAT_ID: ${{ secrets.TELEGRAM_MEDIA_STAGE_CHAT_ID }}
      ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_MEDIA_STAGE_CHAT_ID }}
      AMAZON_REVIEW_GROUP_ID: ${{ secrets.AMAZON_REVIEW_GROUP_ID }}
      AMAZON_CHANNEL_ID: ${{ secrets.AMAZON_CHANNEL_ID }}
      AMAZON_NORMAL_REVIEW_CHAT_ID: ${{ secrets.AMAZON_NORMAL_REVIEW_CHAT_ID }}

      # TEMP STORE POLICY: Amazon first in its dedicated radar, then Noon, then B.TECH only.
      DIRECT_FLASH_REVIEW: "false"
      V11_ENABLED_STORES: "noon,btech,2b"
      ENABLED_STORES: "noon,btech,2b"
      MIN_DISCOUNT_PERCENT: "5"
      MIN_SAVING_EGP: "0"
      MAX_POSTS_PER_CYCLE: "10"
      MAX_VERIFY_CANDIDATES: "20"
      REQUEST_TIMEOUT_SECONDS: "20"
      STRICT_VERIFICATION: "true"
      STORE_SCREENSHOT_REVIEWS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            telegram_deals_bot_v7_dev/requirements.txt
            amazon_dynamic_runtime_v8/telegram_deals_bot_v1_ready/requirements.txt
            amazon_dynamic_runtime_v8/requirements_ready.txt

      - name: Install dependencies + screenshot browser
        run: |
          python -m pip install --upgrade pip
          pip install -r telegram_deals_bot_v7_dev/requirements.txt
          pip install -r amazon_dynamic_runtime_v8/telegram_deals_bot_v1_ready/requirements.txt
          pip install -r amazon_dynamic_runtime_v8/requirements_ready.txt
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Restore runtime state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/state.sh hydrate || echo '⚠️ STATE HYDRATE WARNING — CONTINUING SCAN'

      - name: Competitor benchmark + flash memory
        run: |
          echo "📡 CHECKING DEAL CHANNEL BENCHMARKS"
          python scripts/channel_benchmark.py || echo "⚠️ CHANNEL BENCHMARK FAILED — CONTINUING"

          echo "🧠 PROCESSING FLASH DEAL MEMORY"
          python scripts/channel_flash_memory.py || echo "⚠️ FLASH MEMORY FAILED — CONTINUING"

      # AMAZON ALWAYS GOES FIRST.
      - name: Amazon — priority scan + real product screenshot
        run: |
          set -e

          python scripts/prepare_amazon_review_config.py

          echo "🤖 STARTING AMAZON REVIEW BUTTON LISTENER"

          python amazon_dynamic_runtime_v8/amazon_deals_bot_ready/bot.py             > /tmp/amazon_review_listener.log 2>&1 &

          AMAZON_LISTENER_PID=$!

          echo "🤖 AMAZON LISTENER PID=$AMAZON_LISTENER_PID"

          # Wait until Telegram polling is really active
          for i in $(seq 1 20); do
            if grep -q "TELEGRAM POLLING ON" /tmp/amazon_review_listener.log 2>/dev/null; then
              echo "✅ TELEGRAM POLLING IS ACTIVE"
              break
            fi

            if ! kill -0 "$AMAZON_LISTENER_PID" 2>/dev/null; then
              echo "❌ AMAZON LISTENER DIED BEFORE SCAN"
              cat /tmp/amazon_review_listener.log || true
              exit 1
            fi

            sleep 1
          done

          if ! grep -q "TELEGRAM POLLING ON" /tmp/amazon_review_listener.log 2>/dev/null; then
            echo "❌ TELEGRAM POLLING DID NOT START"
            cat /tmp/amazon_review_listener.log || true
            kill "$AMAZON_LISTENER_PID" 2>/dev/null || true
            exit 1
          fi

          echo "🚀 STARTING AMAZON SCAN"
          python scripts/run_amazon_once.py

          echo "✅ AMAZON SCAN FINISHED"
          echo "🤖 REVIEW BUTTONS ACTIVE FOR 2 MORE MINUTES"

          for i in $(seq 1 12); do
            if ! kill -0 "$AMAZON_LISTENER_PID" 2>/dev/null; then
              echo "❌ AMAZON LISTENER STOPPED"
              cat /tmp/amazon_review_listener.log || true
              exit 1
            fi
            sleep 10
          done

          echo "========== AMAZON REVIEW LISTENER LOG =========="
          cat /tmp/amazon_review_listener.log || true

          kill "$AMAZON_LISTENER_PID" 2>/dev/null || true
          wait "$AMAZON_LISTENER_PID" 2>/dev/null || true
      - name: Noon then B.TECH — verified scan + screenshots
        run: python scripts/run_v11_once.py

      - name: Collect runtime state
        if: always()
        run: bash scripts/state.sh collect || echo '⚠️ STATE COLLECT WARNING — CONTINUING'

      - name: Persist runtime state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-state
          path: .runtime_state/
          retention-days: 1
          if-no-files-found: warn
          include-hidden-files: true
          compression-level: 6
