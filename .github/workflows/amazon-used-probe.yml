name: Amazon Used Isolated Probe

on:
  push:
    branches: [used-probe-test]
    paths:
      - 'cloudflare_amazon_v14/used_probe/**'
      - '.github/workflows/amazon-used-probe.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare_amazon_v14
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUD_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify product-page used evidence parser
        run: node --test used_probe/offer_parser.test.mjs used_probe/resale_source.test.mjs used_probe/resale_navigation.test.mjs used_probe/resale_search.test.mjs used_probe/resale_links.test.mjs used_probe/resale_real_source.test.mjs used_probe/resale_snapshot.test.mjs used_probe/resale_link_audit.test.mjs

      - name: Deploy isolated probe
        run: npx wrangler deploy -c used_probe/wrangler.jsonc

      - name: Test browser and report
        run: |
          set -eu
          KEY="$(openssl rand -hex 24)"
          printf '%s' "$KEY" | npx wrangler secret put PROBE_KEY -c used_probe/wrangler.jsonc
          echo "Waiting for secret propagation"
          sleep 25
          # One read of exact user-provided Resale section, no retries or unverified publication.
          # Fail closed on throttling and preserve detailed results as an artifact.
          PROBE_KEY="$KEY" python3 used_probe/run_resale_link_audit.py
          # Prior isolated product-page check got Amazon HTTP 429.
          # No repeated product requests here; diagnose only the working Resale landing.
          echo "AMAZON_USED_PRODUCT_REQUESTS_PAUSED_AFTER_HTTP_429"

      - name: Save isolated used-offer pilot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-used-link-audit-v12-${{ github.run_id }}
          path: |
            cloudflare_amazon_v14/used_probe/reports/amazon_used_resale_link_audit_v12.json
            cloudflare_amazon_v14/used_probe/reports/amazon_used_known_product.json
          retention-days: 7
          if-no-files-found: warn
