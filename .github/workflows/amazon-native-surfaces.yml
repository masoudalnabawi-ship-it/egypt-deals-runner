name: Amazon Native Surfaces

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Test native Amazon discovery pages
        run: |
          python - <<'PY'
          import re
          import urllib.request
          import urllib.error

          urls = [
              ("BESTSELLERS", "https://www.amazon.eg/gp/bestsellers"),
              ("MOVERS", "https://www.amazon.eg/gp/movers-and-shakers"),
              ("NEW_RELEASES", "https://www.amazon.eg/gp/new-releases"),
              ("GOLDBOX", "https://www.amazon.eg/gp/goldbox"),
          ]

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/140.0 Safari/537.36"
              ),
              "Accept-Language": "ar-EG,ar;q=0.9,en;q=0.8",
          }

          for name, url in urls:
              print()
              print("=" * 60)
              print(name)

              req = urllib.request.Request(url, headers=headers)

              try:
                  with urllib.request.urlopen(
                      req,
                      timeout=20
                  ) as r:
                      body = r.read().decode(
                          "utf-8",
                          errors="ignore"
                      )

                      asins = set(
                          re.findall(
                              r'data-asin=["\']([A-Z0-9]{10})',
                              body
                          )
                      )

                      print("HTTP =", r.status)
                      print(
                          "CONTENT-TYPE =",
                          r.headers.get("content-type")
                      )
                      print("ASINS =", len(asins))

                      if asins:
                          print(
                              "SAMPLE =",
                              list(asins)[:10]
                          )
                          print("✅ USABLE DISCOVERY SOURCE")
                      else:
                          print("❌ NO ASINS")

              except urllib.error.HTTPError as e:
                  print("HTTP ERROR =", e.code)

              except Exception as e:
                  print("ERROR =", repr(e))
          PY
