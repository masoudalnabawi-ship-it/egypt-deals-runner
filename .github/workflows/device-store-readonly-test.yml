name: Device Stores Readonly Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Discover device URLs (no publishing)
        run: |
          PYTHONPATH=scripts python scripts/device_store_autodiscover.py --output device_store_targets.json
      - name: Scan verified device prices (no publishing)
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          p=Path('device_store_targets.json')
          rows=json.loads(p.read_text()) if p.exists() else []
          extra=Path('device_2b_targets.json')
          if extra.exists():
              rows.extend(json.loads(extra.read_text(encoding='utf-8')))
          p.write_text(json.dumps(rows[:45],ensure_ascii=False))
          print('Scanning up to',len(rows[:45]),'candidate URLs')
          PYCODE
          if [ "$(python -c "import json;print(len(json.load(open('device_store_targets.json'))))")" -gt 0 ]; then
            PYTHONPATH=scripts python scripts/device_store_scanner.py --targets device_store_targets.json --db device_store_history.sqlite3 > device_store_scan.json
          else
            echo '{"results":[],"published":0}' > device_store_scan.json
          fi
      - name: Upload results for manual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-store-readonly-results
          path: |
            device_store_targets.json
            device_store_scan.json
            device_store_history.sqlite3
          if-no-files-found: ignore
