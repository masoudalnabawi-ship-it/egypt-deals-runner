name: Device Stores Readonly Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Check legacy 2B offers access
        run: |
          python - <<'PYCODE'
          import urllib.request
          url = 'https://2b.com.eg/ar/offer.html'
          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=25) as r:
                  html = r.read().decode('utf-8', 'replace')
                  print('HTTP:', r.status)
                  print('PRODUCT CARDS:', html.count('product-item'))
                  print('PRICE DATA:', html.count('data-price-amount'))
                  print('CLOUDFLARE BLOCK:', 'Attention Required!' in html)
          except Exception as e:
              print('ERROR:', repr(e))
          PYCODE
      - name: Check 2B sitemap from GitHub
        run: |
          python - <<'PYTEST'
          import urllib.request
          import urllib.error
          from xml.etree import ElementTree as ET

          url = "https://2b.com.eg/ar_sitemap-2-1.xml"
          try:
              with urllib.request.urlopen(url, timeout=20) as r:
                  print("SITEMAP_STATUS:", r.status)
                  root = ET.fromstring(r.read())
                  ns = {"s": "http://www.sitemaps.org/schemas/sitemap/0.9"}
                  print("SITEMAP_URLS:", len(root.findall(".//s:loc", ns)))
          except urllib.error.HTTPError as e:
              print("SITEMAP_STATUS:", e.code)
          except Exception as e:
              print("SITEMAP_ERROR:", type(e).__name__)
          PYTEST
      - name: Check 2B Cloudflare proxy
        env:
          CLOUD_API_URL: ${{ secrets.CLOUD_API_URL }}
          CLOUD_API_KEY: ${{ secrets.CLOUD_API_KEY }}
        run: |
          python - <<'PYCODE'
          import os
          import urllib.request
          import urllib.error
          import urllib.parse

          base = os.getenv('CLOUD_API_URL', '').strip().rstrip('/')
          key = os.getenv('CLOUD_API_KEY', '').strip()
          if base.endswith('/api/deals'):
              base = base[:-len('/api/deals')]

          if not base or not key:
              print('PROXY_CONFIG: MISSING')
          else:
              url = base + '/api/store-proxy?' + urllib.parse.urlencode({
                  'url': 'https://2b.com.eg/ar/offer.html'
              })
              try:
                  req = urllib.request.Request(url, headers={
                      'x-api-key': key,
                      'Accept': 'text/html'
                  })
                  with urllib.request.urlopen(req, timeout=35) as r:
                      html = r.read(2000000).decode('utf-8', 'replace')
                      print('PROXY_STATUS:', r.status)
                      print('PRODUCT_CARDS:', html.count('product-item'))
                      print('PRICE_DATA:', html.count('data-price-amount'))
                      print('PROTECTION_PAGE:', 'Attention Required!' in html)
              except urllib.error.HTTPError as e:
                  print('PROXY_STATUS:', e.code)
                  print('PROXY_REQUEST_FAILED')
              except Exception as e:
                  print('PROXY_ERROR_TYPE:', type(e).__name__)
          PYCODE
      - name: Discover device URLs (no publishing)
        run: |
          PYTHONPATH=scripts python scripts/device_store_autodiscover.py --output device_store_targets.json
      - name: Scan verified device prices (no publishing)
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          p=Path('device_store_targets.json')
          rows=json.loads(p.read_text()) if p.exists() else []
          extra=Path('device_2b_targets.json')
          if extra.exists():
              rows.extend(json.loads(extra.read_text(encoding='utf-8')))
          p.write_text(json.dumps(rows[:45],ensure_ascii=False))
          print('Scanning up to',len(rows[:45]),'candidate URLs')
          PYCODE
          if [ "$(python -c "import json;print(len(json.load(open('device_store_targets.json'))))")" -gt 0 ]; then
            PYTHONPATH=scripts python scripts/device_store_scanner.py --targets device_store_targets.json --db device_store_history.sqlite3 > device_store_scan.json
          else
            echo '{"results":[],"published":0}' > device_store_scan.json
          fi
      - name: Upload results for manual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-store-readonly-results
          path: |
            device_store_targets.json
            device_store_scan.json
            device_store_history.sqlite3
          if-no-files-found: ignore
