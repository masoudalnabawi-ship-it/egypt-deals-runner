name: V16 D1 Dedup Test

on:
  push:
    branches:
      - feature/v16-smart-dedup-20261013203210
    paths:
      - .github/workflows/v16-dedup-cloud-test.yml

permissions:
  contents: read

jobs:
  test-dedup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify persistent dedup
        env:
          V16_WORKER_URL: ${{ vars.V16_WORKER_URL }}
          V16_REGISTRATION_SECRET: ${{ secrets.V16_REGISTRATION_SECRET }}
        run: |
          python3 - <<'PY'
          import json, os, uuid, urllib.request

          url = os.environ['V16_WORKER_URL'].rstrip('/')
          secret = os.environ['V16_REGISTRATION_SECRET']
          asin = 'T' + uuid.uuid4().hex[:9].upper()
          price = 12345

          def call(path, owner, success=None):
              payload = {'asin': asin, 'price_cents': price, 'owner': owner}
              if success is not None:
                  payload['success'] = success
              req = urllib.request.Request(
                  url + path,
                  data=json.dumps(payload).encode(),
                  headers={
                      'Authorization': 'Bearer ' + secret,
                      'Content-Type': 'application/json'
                  },
                  method='POST'
              )
              import subprocess
              result = subprocess.run(
                  [
                      'curl', '--silent', '--show-error',
                      '--max-time', '15',
                      '--request', 'POST',
                      '--header', 'Authorization: Bearer ' + secret,
                      '--header', 'Content-Type: application/json',
                      '--data-binary', '@-',
                      '--write-out', '\n%{http_code}',
                      url + path
                  ],
                  input=json.dumps(payload),
                  text=True,
                  capture_output=True,
                  timeout=20
              )
              if result.returncode:
                  raise RuntimeError('CURL_FAILED: ' + result.stderr[:200])
              body, status = result.stdout.rsplit('\n', 1)
              if status != '200':
                  raise RuntimeError(
                      'HTTP_STATUS: ' + status + ' RESPONSE: ' + body[:200]
                  )
              return json.loads(body)

          owner1 = uuid.uuid4().hex
          owner2 = uuid.uuid4().hex

          # A new offer must pass the read-only pre-screenshot check.
          fresh = call('/dedup/check', owner1)
          assert fresh.get('duplicate') is False, fresh

          first = call('/dedup/claim', owner1)
          assert first.get('allowed') is True, first

          # An active lease must block screenshot work.
          early_duplicate = call('/dedup/check', owner2)
          assert early_duplicate.get('duplicate') is True, early_duplicate

          duplicate = call('/dedup/claim', owner2)
          assert duplicate.get('allowed') is False, duplicate

          finished = call('/dedup/finish', owner1, False)
          assert finished.get('ok') is True, finished

          # A released lease must allow another attempt.
          released = call('/dedup/check', owner2)
          assert released.get('duplicate') is False, released

          retry = call('/dedup/claim', owner2)
          assert retry.get('allowed') is True, retry

          cleanup = call('/dedup/finish', owner2, False)
          assert cleanup.get('ok') is True, cleanup

          print('V16_D1_DEDUP_TEST_PASSED')
          PY
