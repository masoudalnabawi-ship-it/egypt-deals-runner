name: V16 Initialize D1

on:
  push:
    branches:
      - feature/v16-smart-dedup-20261013203210
    paths:
      - .github/workflows/v16-init-d1.yml

permissions:
  contents: read

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Initialize V16 D1 tables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4 d1 execute egypt-amazon-v16-db \
            --remote \
            --file=cloudflare/v16-telegram-webhook/schema.sql
