name: Talabat Mart Fast Watch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/talabat-fast-watch.yml'
  workflow_run:
    workflows: ['Amazon V14 Pipeline']
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: talabat-fast-watch
  cancel-in-progress: false

jobs:
  scan:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TALABAT_FAST: '1'
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      REVIEW_WORKER_URL: https://egypt-talabat-review.masoud-amazon-eg.workers.dev

    defaults:
      run:
        working-directory: cloudflare_amazon_v14

    steps:
      - uses: actions/checkout@v4
        with:
          ref: used-probe-test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan Talabat
        run: python3 -u scripts/talabat_branch_scan.py

      - name: Validate scan
        run: |
          python3 -c 'import json;d=json.load(open("reports/talabat_multi_branch.json"));assert len(d["branches"])==3 and sum(x["pages_checked"] for x in d["branches"])>=6,"INCOMPLETE_SCAN"'

      - name: Recheck prices and stock
        run: python3 -u scripts/talabat_recheck.py

      - name: Send private review alerts
        run: |
          python3 -m pip install -q requests playwright
          python3 -m playwright install --with-deps chromium
          python3 -u scripts/talabat_dynamic_review.py

      - name: Save reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talabat-fast-${{ github.run_id }}
          path: cloudflare_amazon_v14/reports/*.json
          retention-days: 1
