name: Egypt Deals Realtime

on:
  workflow_dispatch:

jobs:
  realtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      CLOUD_API_URL: ${{ secrets.CLOUD_API_URL }}
      CLOUD_API_KEY: ${{ secrets.CLOUD_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install httpx
        run: pip install httpx

      - name: Test Cloud store proxy
        run: |
          python - <<'PY'
          import os
          import httpx

          base = os.environ["CLOUD_API_URL"].strip().rstrip("/")

          if base.endswith("/api/deals"):
              base = base[:-len("/api/deals")]

          endpoint = base + "/api/store-proxy"

          target = (
              "https://www.noon.com/"
              "egypt-en/daily-deals-eg/"
          )

          print("CLOUD_URL_PRESENT:", bool(base))
          print("CLOUD_KEY_PRESENT:", bool(os.environ.get("CLOUD_API_KEY")))
          print("ENDPOINT_PATH: /api/store-proxy")

          try:
              r = httpx.get(
                  endpoint,
                  params={"url": target},
                  headers={
                      "x-api-key": os.environ["CLOUD_API_KEY"],
                      "Accept": "text/html",
                  },
                  timeout=40,
                  follow_redirects=True,
              )

              print("STATUS:", r.status_code)
              print("CONTENT_TYPE:", r.headers.get("content-type"))
              print("BODY_SIZE:", len(r.content))
              print("BODY_START:")
              print(r.text[:1500])

          except Exception as exc:
              print(
                  "REQUEST_ERROR:",
                  type(exc).__name__,
                  str(exc),
              )

          print("✅ PROXY DIAGNOSTIC COMPLETE")
          PY
