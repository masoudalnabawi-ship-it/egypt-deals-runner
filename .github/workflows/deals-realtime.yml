name: Egypt Deals Realtime

on:
  workflow_dispatch:

jobs:
  realtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CLOUD_API_URL: ${{ secrets.CLOUD_API_URL }}
      CLOUD_API_KEY: ${{ secrets.CLOUD_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r telegram_deals_bot_v7_dev/requirements.txt

      - name: Noon deep diagnostic
        run: |
          python - <<'PY'
          import asyncio
          import os
          import sys
          from pathlib import Path

          ROOT = Path.cwd()
          sys.path.insert(
              0,
              str(ROOT / "telegram_deals_bot_v7_dev")
          )

          from stores.noon import NoonConnector

          print("================================")
          print("NOON ACTIONS DIAGNOSTIC")
          print("================================")

          print(
              "CLOUD_API_URL:",
              "PRESENT" if os.getenv("CLOUD_API_URL") else "MISSING"
          )

          print(
              "CLOUD_API_KEY:",
              "PRESENT" if os.getenv("CLOUD_API_KEY") else "MISSING"
          )

          c = NoonConnector(
              25,
              "Mozilla/5.0",
          )

          async def main():
              total = 0

              for index, url in enumerate(
                  c.DEAL_URLS,
                  1,
              ):
                  print()
                  print(f"PAGE {index}: {url}")

                  try:
                      soup = await asyncio.wait_for(
                          c.get_soup(url),
                          timeout=50,
                      )

                      html = str(soup)

                      print(
                          "HTML_SIZE:",
                          len(html),
                      )

                      print(
                          "TITLE:",
                          (
                              soup.title.get_text(
                                  " ",
                                  strip=True
                              )[:150]
                              if soup.title
                              else "-"
                          )
                      )

                      deals = c._parse_page(soup)

                      print(
                          "PARSED:",
                          len(deals),
                      )

                      total += len(deals)

                      for d in deals[:2]:
                          print(
                              "SAMPLE:",
                              str(d.title)[:90],
                              "| now=",
                              d.current_price,
                              "| old=",
                              d.old_price,
                          )

                  except Exception as exc:
                      print(
                          "ERROR:",
                          type(exc).__name__,
                          str(exc)[:600],
                      )

              print()
              print("TOTAL_PARSED:", total)

          asyncio.run(main())

          print("✅ NOON ACTIONS DIAGNOSTIC COMPLETE")
          PY
