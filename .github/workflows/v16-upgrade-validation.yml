name: V16 Upgrade Validation
on:
  push:
    branches:
      - 'feature/v16-upgrade-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install pytest playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run V16 tests
        run: python -m pytest -q tests/v16
      - name: Live discovery (no Telegram sends)
        run: python scripts/v16/production_discovery.py --max-pages 4 --max-candidates 40 --output v16-discovery-candidates.json
      - name: Live full pipeline (NO Telegram)
        env:
          V16_PRIVATE_TELEGRAM_ENABLED: '0'
        run: |
          PYTHONPATH=scripts/v16:scripts/v15:scripts/v14 python scripts/v16/production_pipeline.py --max-candidates 5 --output v16-pipeline-results.json --health-output v16-health.json
      - name: Summarize pipeline
        if: always()
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          p = Path('v16-pipeline-results.json')
          if p.exists():
              d = json.loads(p.read_text())
              print('V16_PIPELINE_RESULT:', json.dumps(d, ensure_ascii=False))
          else:
              print('V16_PIPELINE_RESULT: missing')
          PYCODE
      - name: Summarize
        run: |
          python - <<'PY'
          import json
          d=json.load(open('v16-discovery-candidates.json'))
          print('V16_REAL_CANDIDATES:',len(d['candidates']))
          print('V16_SOURCE_ERRORS:',len(d['errors']))
          for item in d['candidates'][:10]:
              print('ASIN:',item['asin'],'HINT:',item['listing_discount_hint'])
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v16-upgrade-evidence
          path: |
            v16-discovery-candidates.json
            v16-pipeline-results.json
            v16-health.json
          if-no-files-found: ignore
