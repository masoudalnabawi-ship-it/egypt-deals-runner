name: V12 Competitors Realtime

on:
  workflow_dispatch:

jobs:
  competitors:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    env:
      PYTHONPATH: .
      COMPETITOR_TELEGRAM_BOT_TOKEN: ${{ secrets.COMPETITOR_TELEGRAM_BOT_TOKEN }}
      COMPETITOR_REVIEW_CHAT_ID: ${{ secrets.COMPETITOR_REVIEW_CHAT_ID }}
      V12_COMPETITOR_SCAN_INTERVAL: "90"
      V12_DB_PATH: .runtime_state/competitors_v12.db
      V12_SEEN_LEDGER: .runtime_state/competitors_seen_ledger.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore competitors state
        uses: actions/cache/restore@v4
        with:
          path: |
            .runtime_state/competitors_v12.db
            .runtime_state/competitors_v12.db-wal
            .runtime_state/competitors_v12.db-shm
            .runtime_state/competitors_seen_ledger.json
          key: competitors-v12-state-${{ github.run_id }}
          restore-keys: |
            competitors-v12-state-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4 playwright pillow arabic-reshaper python-bidi
          python -m playwright install --with-deps chromium

      - name: Run competitors worker
        shell: bash
        run: |
          set +e
          timeout --signal=TERM 300m python scripts/run_v12_competitors.py
          code=$?

          if [ "$code" -eq 124 ] || [ "$code" -eq 143 ]; then
            exit 0
          fi

          exit "$code"

      - name: Save competitors state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .runtime_state/competitors_v12.db
            .runtime_state/competitors_v12.db-wal
            .runtime_state/competitors_v12.db-shm
            .runtime_state/competitors_seen_ledger.json
          key: competitors-v12-state-${{ github.run_id }}
