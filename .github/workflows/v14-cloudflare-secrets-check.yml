name: V14 Cloudflare Secrets Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v14-cloudflare

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Worker secret names only
        working-directory: cloudflare_amazon_v14
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUD_API_KEY }}
        run: |
          npm install --no-audit --no-fund
          npx wrangler secret list --config wrangler.jsonc \
            | node -e '
              let input = "";
              process.stdin.on("data", c => input += c);
              process.stdin.on("end", () => {
                const names = JSON.parse(input).map(x => x.name);
                for (const name of [
                  "AMAZON_CHANNEL_ID",
                  "TELEGRAM_CHANNEL_ID",
                  "NOON_REVIEW_BOT_TOKEN",
                  "NOON_REVIEW_BOT_CHAT_ID",
                  "NOON_CHANNEL_ID",
                  "NOON_TELEGRAM_WEBHOOK_SECRET"
                ]) {
                  console.log(name + ": " +
                    (names.includes(name) ? "PRESENT" : "MISSING"));
                }
              });
            '
