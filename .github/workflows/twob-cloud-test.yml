name: 2B Cloud Access Test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check 2B offers page
        run: |
          python3 - <<'PY'
          import urllib.request
          u = 'https://2b.com.eg/ar/offer.html'
          try:
              req = urllib.request.Request(u, headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=25) as r:
                  html = r.read().decode('utf-8','replace')
                  print('HTTP:', r.status)
                  print('PRODUCT CARDS:', html.count('product-item'))
                  print('PRICE DATA:', html.count('data-price-amount'))
                  print('CLOUDFLARE BLOCK:', 'Attention Required!' in html)
          except Exception as e:
              print('ERROR:', repr(e))
          PY
