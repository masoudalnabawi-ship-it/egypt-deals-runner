name: V16 Automatic Private Deals

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v16-automatic-private-deals
  cancel-in-progress: false

jobs:
  discover-and-send:
    if: ${{ vars.V16_AUTOMATION_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v16-smart-dedup-20261013203210

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser
        run: |
          python -m pip install playwright==1.56.0 requests
          python -m playwright install --with-deps chromium

      - name: Discover and send private photo offers
        env:
          PYTHONPATH: scripts/v16:scripts/v14
          V16_PRIVATE_TELEGRAM_ENABLED: '1'
          V16_INTERACTIVE_READY: '0'
          V16_DEDUP_BACKEND: d1
          V16_MAX_SEND_PER_RUN: '10'
          V16_MAX_RUNTIME_SECONDS: '235'
          V16_ROTATE_SOURCES: '1'
          V16_ROTATE_CANDIDATES: '1'
          V16_MIN_SEND_DISCOUNT: '50'
          V15_TELEGRAM_BOT_TOKEN: ${{ secrets.V15_TELEGRAM_BOT_TOKEN }}
          V15_TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.V15_TELEGRAM_REVIEW_CHAT_ID }}
          V16_WORKER_URL: ${{ vars.V16_WORKER_URL }}
          V16_REGISTRATION_SECRET: ${{ secrets.V16_REGISTRATION_SECRET }}
        run: |
          python scripts/v16/production_pipeline.py             --professional --send --max-candidates 16             --output v16-auto-report.json             --health-output v16-auto-health.json

      - name: V16 Health Summary
        if: always()
        run: |
          python - <<'PYHEALTH'
          import json
          import os
          from pathlib import Path

          path = Path("v16-auto-health.json")
          lines = ["## V16 Automatic Deals — Health Report", ""]

          if not path.exists():
              lines += [
                  "### ❌ CRITICAL: Health report missing",
                  "The pipeline failed before producing its health report.",
              ]
              print("::error::V16 health report missing")
          else:
              h = json.loads(path.read_text(encoding="utf-8"))
              status = h.get("status", "UNKNOWN")
              sources = int(h.get("source_failures", 0))
              products = int(h.get("product_failures", 0))

              if status in ("PARTIAL_FAILURE", "NO_VERIFIED_PROBES", "NO_CANDIDATES") or sources or products:
                  print(f"::warning::V16 status={status}; source_failures={sources}; product_failures={products}")

              lines += [
                  f"### Status: {status}",
                  "",
                  "| Metric | Value |",
                  "|---|---:|",
              ]

              for label, key in [
                  ("Discovered", "discovered"),
                  ("Probed", "probed"),
                  ("Eligible", "eligible"),
                  ("Text alerts", "text_alert_results"),
                  ("Source failures", "source_failures"),
                  ("Product failures", "product_failures"),
              ]:
                  lines.append(f"| {label} | {h.get(key, 0)} |")

              lines += [
                  "",
                  "Source failures are reported as warnings; they do not automatically stop the bot.",
              ]

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as f:
                  f.write("\\n".join(lines) + "\\n")
          print("\\n".join(lines))
          PYHEALTH

      - name: Save reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v16-automatic-report
          path: |
            v16-auto-report.json
            v16-auto-health.json
          if-no-files-found: ignore
          retention-days: 3
