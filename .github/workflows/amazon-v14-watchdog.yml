name: Amazon V14 Watchdog
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  issues: write
concurrency:
  group: amazon-v14-watchdog
  cancel-in-progress: false
jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check pipeline and deduplicate alerts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALERT_CHAT_ID: ${{ secrets.AMAZON_NORMAL_REVIEW_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ['GH_REPO']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json',
                     'User-Agent': 'amazon-v14-watchdog'}
          base = 'https://api.github.com/repos/' + repo

          def api(path, method='GET', payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(base + path, data=data,
                                               headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          now = dt.datetime.now(dt.timezone.utc)
          runs = api('/actions/workflows/amazon-v14-pipeline.yml/runs?per_page=50')['workflow_runs']
          successful = []
          for run in runs:
              if run.get('event') not in ('schedule', 'workflow_dispatch'):
                  continue
              if run.get('conclusion') != 'success':
                  continue
              finished = dt.datetime.fromisoformat(
                  (run.get('updated_at') or run['created_at']).replace('Z', '+00:00'))
              if 0 <= (now - finished).total_seconds() < 2400:
                  successful.append(run)
          healthy = bool(successful)
          marker = '[amazon-v14-watchdog-outage]'
          issues = api('/issues?state=all&per_page=100')
          tracked = next((issue for issue in issues
                          if issue.get('title', '').startswith(marker)
                          and 'pull_request' not in issue), None)
          if healthy:
              print('WATCHDOG_OK: pipeline succeeded within 40 minutes')
              if tracked and tracked['state'] == 'open':
                  api('/issues/' + str(tracked['number']), 'PATCH', {'state': 'closed'})
                  print('WATCHDOG_RECOVERED')
          elif tracked and tracked['state'] == 'open':
              print('WATCHDOG_DEDUP: outage already reported')
          else:
              print('WATCHDOG_ALERT: no successful pipeline within 40 minutes')
              bot = os.environ.get('TELEGRAM_BOT_TOKEN')
              chat = os.environ.get('ALERT_CHAT_ID')
              if not bot or not chat:
                  raise RuntimeError('Telegram credentials missing')
              message = '🚨 مراقب أمازون V14: لم يُسجل تشغيل ناجح خلال آخر 40 دقيقة. راجع GitHub Actions.'
              data = urllib.parse.urlencode({'chat_id': chat, 'text': message}).encode()
              request = urllib.request.Request(
                  'https://api.telegram.org/bot' + bot + '/sendMessage', data=data)
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.load(response)
              if not result.get('ok'):
                  raise RuntimeError('Telegram rejected alert')
              if tracked:
                  api('/issues/' + str(tracked['number']), 'PATCH', {'state': 'open'})
              else:
                  api('/issues', 'POST', {'title': marker + ' Pipeline outage',
                      'body': 'Watchdog alert marker. Close automatically on recovery.'})
              print('WATCHDOG_ALERT_SENT')
          PY
