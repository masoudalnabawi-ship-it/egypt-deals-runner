name: V15 Telegram Private Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    steps:
      - name: Send private Telegram test
        env:
          BOT_TOKEN: ${{ secrets.V15_TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.V15_TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["BOT_TOKEN"]
          chat_id = os.environ["CHAT_ID"]

          payload = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": "⚡ Egypt Deal Hunter V15\n\n✅ الاتصال ناجح!\n🔒 تنبيهات المراجعة الخاصة جاهزة للاختبار.\n🚫 النشر العام غير مفعّل."
          }).encode()

          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.load(response)
              if not result.get("ok"):
                  raise RuntimeError("Telegram rejected the message")
              print("V15_TELEGRAM_PRIVATE_TEST_SUCCESS")
          except Exception:
              print("V15_TELEGRAM_PRIVATE_TEST_FAILED")
              raise SystemExit(1)
          PY
