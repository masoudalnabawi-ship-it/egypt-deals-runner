name: V12 Amazon Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      AMAZON_NORMAL_REVIEW_CHAT_ID: ${{ secrets.AMAZON_NORMAL_REVIEW_CHAT_ID }}

    steps:
      - name: Checkout V12
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install V12 dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4 playwright pillow arabic-reshaper python-bidi
          python -m playwright install --with-deps chromium

      - name: Run one verified Amazon review
        run: |
          PYTHONPATH=. python scripts/v12_smoke_review.py
