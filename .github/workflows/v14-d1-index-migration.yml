name: V14 D1 Index Migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout V14
        uses: actions/checkout@v4
        with:
          ref: v14-cloudflare

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: cloudflare_amazon_v14
        run: npm install --no-audit --no-fund

      - name: Apply V14 index only
        working-directory: cloudflare_amazon_v14
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUD_API_KEY }}
        run: |
          npx wrangler d1 execute egypt-amazon-v14-db \
            --remote \
            --config wrangler.jsonc \
            --command "CREATE INDEX IF NOT EXISTS idx_events_event_ts_deal ON events(event, ts, deal_key);"
