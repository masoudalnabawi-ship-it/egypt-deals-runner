name: Amazon V15 Monitoring Dispatcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitoring:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout V15
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Read due products from V15 D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b015795e3322f02ca29cf8d8f1982212
        run: |
          set -euo pipefail
          python scripts/v15/monitoring_dispatcher.py
