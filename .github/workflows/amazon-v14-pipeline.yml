name: Amazon V14 Pipeline

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: Send one test message to normal review group
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: amazon-v14-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      V14_WORKER_URL: https://egypt-amazon-v14.masoud-amazon-eg.workers.dev
      V14_GITHUB_PIPELINE_KEY: ${{ secrets.AMAZON_V14_PIPELINE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      AMAZON_REVIEW_GROUP_ID: ${{ secrets.AMAZON_REVIEW_GROUP_ID }}
      AMAZON_NORMAL_REVIEW_CHAT_ID: ${{ secrets.AMAZON_NORMAL_REVIEW_CHAT_ID }}

    steps:
      - name: Checkout live V14
        uses: actions/checkout@v4
        with:
          ref: v14-cloudflare

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright controller
        run: |
          python -m pip install --upgrade pip
          pip install "playwright==1.56.0" requests

          CHROME="$(
            command -v google-chrome ||
            command -v google-chrome-stable ||
            command -v chromium ||
            true
          )"

          if [ -n "$CHROME" ]; then
            echo "✅ SYSTEM_CHROME=$CHROME"
            "$CHROME" --version || true
          else
            echo "⚠️ System Chrome not found; installing Playwright Chromium only"
            python -m playwright install chromium
          fi

      - name: Send one normal review test message
        if: github.event.inputs.send_test == 'true'
        run: python scripts/v14_production_pipeline.py --send-test

      - name: Trigger Amazon V14 discovery
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'DISCOVERY'
          import os, requests, sys
          from datetime import datetime, timezone

          minute = datetime.now(timezone.utc).minute

          if os.environ.get("EVENT_NAME") != "workflow_dispatch" and minute // 5 % 3 != 0:
              print("V14_DISCOVERY_SKIPPED")
              sys.exit(0)

          key = os.environ.get("V14_GITHUB_PIPELINE_KEY", "").strip()
          if not key:
              print("V14_DISCOVERY_ERROR: missing key")
              sys.exit(1)

          try:
              r = requests.post(
                  os.environ["V14_WORKER_URL"].rstrip("/") + "/admin/discover",
                  headers={"Authorization": "Bearer " + key},
                  timeout=100,
              )
              print("V14_DISCOVERY_HTTP", r.status_code)
              print("V14_DISCOVERY_RESULT", r.text[:3000])
              r.raise_for_status()
          except Exception as e:
              print("V14_DISCOVERY_ERROR", type(e).__name__, str(e)[:200])
              sys.exit(1)
          DISCOVERY

      - name: Drain V14 verification and review queues
        run: |
          python scripts/v14_production_pipeline.py \
            --max-verify 20 \
            --max-deliver 40
