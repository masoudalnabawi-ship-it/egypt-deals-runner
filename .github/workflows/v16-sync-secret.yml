name: V16 Sync Cloudflare Secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Synchronize registration secret
        env:
          CF_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          REG_SECRET: ${{ secrets.V16_REGISTRATION_SECRET }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, sys

          token = os.environ["CF_TOKEN"]
          secret = os.environ["REG_SECRET"]

          if not token or not secret:
              sys.exit("MISSING_REQUIRED_SECRET")

          url = (
              "https://api.cloudflare.com/client/v4/accounts/"
              "b015795e3322f02ca29cf8d8f1982212/"
              "workers/scripts/egypt-amazon-v16-telegram-webhook/secrets"
          )

          data = json.dumps({
              "name": "REGISTRATION_SECRET",
              "text": secret,
              "type": "secret_text"
          }).encode()

          request = urllib.request.Request(
              url,
              data=data,
              method="PUT",
              headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json"
              }
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              print("CLOUDFLARE_HTTP_ERROR:", error.code)
              try:
                  details = json.loads(error.read())
                  print("ERRORS:", details.get("errors", []))
              except Exception:
                  pass
              sys.exit(1)

          print("V16_SECRET_SYNC:", "SUCCESS" if result.get("success") else "FAILED")
          if not result.get("success"):
              print("ERRORS:", result.get("errors", []))
              sys.exit(1)
          PY
