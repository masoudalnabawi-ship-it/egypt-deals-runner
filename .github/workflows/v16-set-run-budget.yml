name: V16 Set Run Budget
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Set V16 daily and monthly limits in Cloudflare
        env:
          CF_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error,sys
          token=os.environ.get('CF_TOKEN','')
          if not token: sys.exit('MISSING_CLOUDFLARE_TOKEN')
          base='https://api.cloudflare.com/client/v4/accounts/b015795e3322f02ca29cf8d8f1982212/workers/scripts/egypt-amazon-v16-telegram-webhook/secrets'
          for name,value in [('V16_DAILY_RUN_LIMIT','288'),('V16_MONTHLY_RUN_LIMIT','8928')]:
              req=urllib.request.Request(base,data=json.dumps({'name':name,'text':value,'type':'secret_text'}).encode(),method='PUT',headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as response: result=json.load(response)
              except urllib.error.HTTPError as exc:
                  print(name,'HTTP_ERROR',exc.code,exc.read().decode()[:400]);sys.exit(1)
              if not result.get('success'): print(name,'FAILED',result.get('errors'));sys.exit(1)
              print(name,'UPDATED')
          PY
