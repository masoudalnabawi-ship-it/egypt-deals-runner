name: V16 Fix Cloudflare Budget Bindings
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Patch existing plain-text Worker bindings safely
        env:
          CF_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,uuid,sys
          token=os.environ.get('CF_TOKEN','')
          if not token: sys.exit('MISSING_CLOUDFLARE_TOKEN')
          url='https://api.cloudflare.com/client/v4/accounts/b015795e3322f02ca29cf8d8f1982212/workers/scripts/egypt-amazon-v16-telegram-webhook/settings'
          headers={'Authorization':'Bearer '+token}
          def api(method,data=None,extra=None):
              req=urllib.request.Request(url,data=data,headers={**headers,**(extra or {})},method=method)
              try:
                  with urllib.request.urlopen(req,timeout=30) as response: return json.load(response)
              except urllib.error.HTTPError as exc:
                  print('CLOUDFLARE_ERROR',exc.code,exc.read().decode()[:1000]);sys.exit(1)
          before=api('GET')
          if not before.get('success'):sys.exit('SETTINGS_READ_FAILED')
          bindings=before.get('result',{}).get('bindings',[])
          targets={'V16_DAILY_RUN_LIMIT':'288','V16_MONTHLY_RUN_LIMIT':'8928'}
          existing={b.get('name'):b for b in bindings}
          for name in targets:
              if name in existing and existing[name].get('type')!='plain_text':
                  sys.exit('UNEXPECTED_BINDING_TYPE_'+name)
          patch=[{'type':'plain_text','name':name,'text':value} for name,value in targets.items()]
          boundary='v16-'+uuid.uuid4().hex
          body=('--'+boundary+'\r\nContent-Disposition: form-data; name="metadata"\r\nContent-Type: application/json\r\n\r\n'+json.dumps({'bindings':patch})+'\r\n--'+boundary+'--\r\n').encode()
          result=api('PATCH',body,{'Content-Type':'multipart/form-data; boundary='+boundary})
          if not result.get('success'):sys.exit('SETTINGS_PATCH_FAILED '+str(result.get('errors')))
          after=api('GET')
          if not after.get('success'):sys.exit('SETTINGS_VERIFY_FAILED')
          actual={b.get('name'):str(b.get('text')) for b in after.get('result',{}).get('bindings',[]) if b.get('type')=='plain_text'}
          for name,value in targets.items():
              if actual.get(name)!=value:sys.exit('BUDGET_NOT_UPDATED_'+name)
          print('V16_BUDGET_VERIFIED: daily=288 monthly=8928')
          PY
