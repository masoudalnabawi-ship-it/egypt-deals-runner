name: V16 Switch Telegram Webhook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - name: Switch Telegram webhook to V16
        env:
          BOT_TOKEN: ${{ secrets.V15_TELEGRAM_BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.V15_TELEGRAM_WEBHOOK_SECRET }}
          V16_URL: ${{ vars.V16_WORKER_URL }}
        run: |
          set -euo pipefail
          test -n "$BOT_TOKEN"
          test -n "$WEBHOOK_SECRET"
          test -n "$V16_URL"

          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request

          token = os.environ["BOT_TOKEN"]
          secret = os.environ["WEBHOOK_SECRET"]
          worker = os.environ["V16_URL"].rstrip("/")
          assert worker.startswith("https://")
          endpoint = f"https://api.telegram.org/bot{token}/"

          data = urllib.parse.urlencode({
              "url": worker + "/telegram",
              "secret_token": secret,
              "drop_pending_updates": "false"
          }).encode()

          with urllib.request.urlopen(
              urllib.request.Request(endpoint + "setWebhook", data=data),
              timeout=25
          ) as response:
              result = json.load(response)
          assert result.get("ok"), result.get("description", "setWebhook failed")

          with urllib.request.urlopen(endpoint + "getWebhookInfo", timeout=25) as response:
              info = json.load(response)
          assert info.get("ok")
          actual = info["result"]["url"]
          assert actual == worker + "/telegram", "Webhook verification failed"
          print("V16_TELEGRAM_WEBHOOK_ACTIVE")
          PY
