name: Amazon Browser Diagnostic

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CLOUD_API_URL: ${{ secrets.CLOUD_API_URL }}
      CLOUD_API_KEY: ${{ secrets.CLOUD_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Test Amazon Egypt Search
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import urllib.request
          import urllib.error

          print("=== RAW HTTP DIAGNOSTIC ===")
          test_url = "https://www.amazon.eg/s?k=electronics+deals"
          req = urllib.request.Request(
              test_url,
              headers={
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36"
              },
          )
          try:
              r = urllib.request.urlopen(req, timeout=20)
              print("STATUS =", r.status)
              print("FINAL_URL =", r.geturl())
              print("CONTENT_TYPE =", r.headers.get("Content-Type"))
              print("CONTENT_DISPOSITION =", r.headers.get("Content-Disposition"))
              print("LOCATION =", r.headers.get("Location"))
          except urllib.error.HTTPError as e:
              print("STATUS =", e.code)
              print("FINAL_URL =", e.geturl())
              print("CONTENT_TYPE =", e.headers.get("Content-Type"))
              print("CONTENT_DISPOSITION =", e.headers.get("Content-Disposition"))
              print("LOCATION =", e.headers.get("Location"))
          except Exception as e:
              print("RAW_HTTP_ERROR =", repr(e))

          print("=== CLOUD PROXY DIAGNOSTIC ===")
          import os
          import urllib.parse

          cloud_url = os.getenv("CLOUD_API_URL", "").strip().rstrip("/")
          cloud_key = os.getenv("CLOUD_API_KEY", "").strip()

          if cloud_url.endswith("/api/deals"):
              cloud_url = cloud_url[:-len("/api/deals")]

          proxy_url = cloud_url + "/api/store-proxy?" + urllib.parse.urlencode(
              {"url": test_url}
          )

          try:
              proxy_req = urllib.request.Request(
                  proxy_url,
                  headers={
                      "x-api-key": cloud_key,
                      "Accept": "text/html",
                  },
              )
              pr = urllib.request.urlopen(proxy_req, timeout=30)
              data = pr.read()
              print("PROXY_STATUS =", pr.status)
              print("PROXY_CONTENT_TYPE =", pr.headers.get("Content-Type"))
              print("PROXY_BYTES =", len(data))
              print("PROXY_HAS_ASIN =", b"data-asin" in data)
          except urllib.error.HTTPError as e:
              print("PROXY_STATUS =", e.code)
              print("PROXY_CONTENT_TYPE =", e.headers.get("Content-Type"))
              print("PROXY_ERROR =", e.read(500).decode("utf-8", errors="replace"))
          except Exception as e:
              print("PROXY_ERROR =", repr(e))

          print("=== PLAYWRIGHT DIAGNOSTIC ===")

          tests = [
              ("ELECTRONICS", "https://www.amazon.eg/s?k=electronics+deals"),
              ("GROCERY", "https://www.amazon.eg/s?k=grocery+deals"),
          ]

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  args=["--no-sandbox"]
              )

              context = browser.new_context(
                  locale="ar-EG",
                  user_agent=(
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/140.0.0.0 Safari/537.36"
                  ),
              )

              for name, url in tests:
                  page = context.new_page()

                  try:
                      response = page.goto(
                          url,
                          wait_until="domcontentloaded",
                          timeout=25000,
                      )

                      page.wait_for_timeout(2500)

                      cards = page.locator(
                          "div.s-result-item[data-asin]"
                      ).count()

                      valid = 0

                      for i in range(min(cards, 50)):
                          card = page.locator(
                              "div.s-result-item[data-asin]"
                          ).nth(i)

                          asin = card.get_attribute(
                              "data-asin"
                          ) or ""

                          if asin.strip():
                              valid += 1

                      print(
                          f"{name}"
                          f" | HTTP={response.status if response else 'NONE'}"
                          f" | CARDS={cards}"
                          f" | VALID={valid}"
                          f" | TITLE={page.title()}"
                      )

                      body = page.locator("body").inner_text()[:1000]

                      if "Robot Check" in body:
                          print("❌ ROBOT CHECK")

                      if "Sorry" in body and valid == 0:
                          print("⚠️ AMAZON ERROR PAGE")

                      if valid > 0:
                          print(
                              f"✅ {name} BROWSER DISCOVERY WORKS"
                          )
                      else:
                          print(
                              f"❌ {name} BROWSER DISCOVERY BLOCKED"
                          )

                  except Exception as exc:
                      print(
                          f"❌ {name} ERROR | {repr(exc)}"
                      )

                  finally:
                      page.close()

              browser.close()
          PY
