name: Amazon Egypt Used Watch - Private Pilot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/amazon-used-private-watch.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * *'

permissions:
  contents: read

concurrency:
  group: amazon-eg-used-watch-private
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUD_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      AMAZON_USED_REVIEW_CHAT_ID: ${{ secrets.AMAZON_REVIEW_GROUP_ID }}
    defaults:
      run:
        working-directory: cloudflare_amazon_v14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: used-probe-test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require dedicated Cloudflare deployment access
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo USED_CLOUD_TOKEN_MISSING; exit 1; }
      - name: Install isolated probe dependencies
        run: npm ci --no-audit --no-fund
      - name: Check used-only parser tests
        run: node --test used_probe/offer_parser.test.mjs used_probe/resale_link_audit.test.mjs
      - name: Deploy only separate Amazon Used probe
        run: npx wrangler deploy -c used_probe/wrangler.jsonc
      - name: Scan one daily Resale product and notify private review only if used price is visible
        run: |
          set -eu
          KEY="$(openssl rand -hex 24)"
          printf '%s' "$KEY" | npx wrangler secret put PROBE_KEY -c used_probe/wrangler.jsonc
          sleep 25
          PROBE_KEY="$KEY" python3 -u used_probe/auto_used_watch.py
      - name: Save private-pilot evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-used-watch-${{ github.run_id }}
          path: cloudflare_amazon_v14/used_probe/reports/amazon_used_private_watch.json
          retention-days: 7
          if-no-files-found: warn
