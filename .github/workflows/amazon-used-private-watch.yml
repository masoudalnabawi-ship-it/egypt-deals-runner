name: Amazon Egypt Used Watch - Private Pilot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/amazon-used-private-watch.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * *'

permissions:
  contents: read

concurrency:
  group: amazon-eg-used-watch-private
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUD_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      AMAZON_USED_REVIEW_CHAT_ID: ${{ secrets.AMAZON_USED_REVIEW_CHAT_ID }}
      AMAZON_USED_DISCOVERY_FALLBACK: '1'
    defaults:
      run:
        working-directory: cloudflare_amazon_v14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: used-probe-test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require dedicated Cloudflare deployment access
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo USED_CLOUD_TOKEN_MISSING; exit 1; }
      - name: Install isolated probe dependencies
        run: npm ci --no-audit --no-fund
      - name: Check used-only parser tests
        run: node --test used_probe/offer_parser.test.mjs used_probe/resale_link_audit.test.mjs
      - name: Check isolated used watch Python syntax
        run: python3 -m py_compile used_probe/auto_used_watch.py
      - name: Diagnose private Telegram review destination
        run: |
          python3 - <<'PYCODE'
          import json, os, re
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          chat = os.environ.get('AMAZON_USED_REVIEW_CHAT_ID', '').strip()
          bot = os.environ.get('TELEGRAM_BOT_TOKEN', '').strip()

          if not re.fullmatch(r'-100\d{6,20}', chat):
              print('DIAGNOSIS: INVALID_CHAT_ID_FORMAT')
              if not chat:
                  print('CHAT_FORMAT: EMPTY')
              elif re.fullmatch(r'-\d+', chat):
                  print('CHAT_FORMAT: NEGATIVE_NUMERIC')
              elif re.fullmatch(r'\d+', chat):
                  print('CHAT_FORMAT: POSITIVE_NUMERIC')
              elif chat.startswith('@'):
                  print('CHAT_FORMAT: USERNAME')
              else:
                  print('CHAT_FORMAT: OTHER')
          elif not re.fullmatch(r'\d{5,12}:[A-Za-z0-9_-]{30,90}', bot):
              print('DIAGNOSIS: INVALID_BOT_TOKEN_FORMAT')
          else:
              try:
                  payload = json.dumps({'chat_id': chat}).encode()
                  req = Request(
                      'https://api.telegram.org/bot' + bot + '/getChat',
                      data=payload,
                      headers={'Content-Type': 'application/json'},
                      method='POST'
                  )
                  with urlopen(req, timeout=15) as response:
                      result = json.load(response)
                  group = result.get('result') or {}
                  if result.get('ok') is not True:
                      print('DIAGNOSIS: TELEGRAM_GETCHAT_NOT_OK')
                  elif group.get('type') not in ('group', 'supergroup'):
                      print('DIAGNOSIS: DESTINATION_NOT_GROUP')
                  elif group.get('username'):
                      print('DIAGNOSIS: GROUP_HAS_PUBLIC_USERNAME')
                  else:
                      print('DIAGNOSIS: PRIVATE_GROUP_ACCESS_OK')
              except HTTPError as ex:
                  print('DIAGNOSIS: TELEGRAM_HTTP_' + str(ex.code))
              except (URLError, TimeoutError):
                  print('DIAGNOSIS: TELEGRAM_CONNECTION_FAILED')
          PYCODE
      - name: Diagnose Amazon review group message
        run: |
          python3 - <<'PYCODE'
          import json, os, re
          from urllib.request import urlopen
          from urllib.error import HTTPError, URLError

          bot = os.environ.get('TELEGRAM_BOT_TOKEN', '').strip()
          if not re.fullmatch(r'\d{5,12}:[A-Za-z0-9_-]{30,90}', bot):
              print('UPDATES_DIAGNOSIS: INVALID_BOT_TOKEN_FORMAT')
          else:
              try:
                  with urlopen('https://api.telegram.org/bot' + bot + '/getUpdates?limit=100&timeout=0', timeout=15) as response:
                      data = json.load(response)
                  if data.get('ok') is not True:
                      print('UPDATES_DIAGNOSIS: API_NOT_OK')
                  else:
                      matches = [
                          (u.get('message') or {}).get('chat', {})
                          for u in data.get('result', [])
                          if (u.get('message') or {}).get('text') == 'Amazon Used Review Test'
                      ]
                      if not matches:
                          print('UPDATES_DIAGNOSIS: TEST_MESSAGE_NOT_FOUND')
                      else:
                          chat = matches[-1]
                          print('UPDATES_DIAGNOSIS: TEST_MESSAGE_FOUND')
                          print('FOUND_CHAT_TYPE:', chat.get('type', 'unknown'))
                          print('FOUND_CHAT_ID_FORMAT:', 'NEGATIVE' if str(chat.get('id', '')).startswith('-') else 'OTHER')
              except HTTPError as ex:
                  print('UPDATES_DIAGNOSIS: HTTP_' + str(ex.code))
              except (URLError, TimeoutError):
                  print('UPDATES_DIAGNOSIS: CONNECTION_FAILED')
          PYCODE
      - name: Deploy only separate Amazon Used probe
        run: npx wrangler deploy -c used_probe/wrangler.jsonc
      - name: Check one used offer and privately flag Resale discovery links when price is blocked
        run: |
          set -eu
          KEY="$(openssl rand -hex 24)"
          printf '%s' "$KEY" | npx wrangler secret put PROBE_KEY -c used_probe/wrangler.jsonc
          sleep 25
          PROBE_KEY="$KEY" python3 -u used_probe/auto_used_watch.py
      - name: Save private-pilot evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-used-watch-${{ github.run_id }}
          path: cloudflare_amazon_v14/used_probe/reports/amazon_used_private_watch.json
          retention-days: 7
          if-no-files-found: warn
