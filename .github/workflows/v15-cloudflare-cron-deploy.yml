name: Amazon V15 Cloudflare Cron Deploy
on:
  push:
    branches: [amazon-v15-rebuild]
    paths:
      - 'cloudflare/v15-cron/**'
      - '.github/workflows/v15-cloudflare-cron-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-v15-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V15
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate secrets
        env:
          CF_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          GH_DISPATCH_TOKEN: ${{ secrets.V15_GITHUB_DISPATCH_TOKEN }}
        run: |
          test -n "$CF_TOKEN" || { echo 'V15_CLOUDFLARE_API_TOKEN missing'; exit 1; }
          test -n "$GH_DISPATCH_TOKEN" || { echo 'V15_GITHUB_DISPATCH_TOKEN missing'; exit 1; }
      - name: Deploy dedicated V15 Cron Worker
        working-directory: cloudflare/v15-cron
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.149.0 deploy
      - name: Install GitHub dispatch token in Cloudflare Worker
        working-directory: cloudflare/v15-cron
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          GH_DISPATCH_TOKEN: ${{ secrets.V15_GITHUB_DISPATCH_TOKEN }}
        run: printf '%s' "$GH_DISPATCH_TOKEN" | npx --yes wrangler@4.149.0 secret put V15_GITHUB_DISPATCH_TOKEN


      - name: Verify GitHub token permissions
        env:
          GH_DISPATCH_TOKEN: ${{ secrets.V15_GITHUB_DISPATCH_TOKEN }}
        run: |
          curl -sS -o /tmp/v15-gh-response.json -w 'V15_GITHUB_HTTP_STATUS=%{http_code}\n' \
            -H "Authorization: Bearer $GH_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/masoudalnabawi-ship-it/egypt-deals-runner
          python3 -c 'import json; d=json.load(open("/tmp/v15-gh-response.json")); print("V15_GITHUB_MESSAGE:",d.get("message","OK"))'

      - name: Verify real V15 scheduled dispatch
        working-directory: cloudflare/v15-cron
        env:
          GH_DISPATCH_TOKEN: ${{ secrets.V15_GITHUB_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PYSECRET'
          import os
          from pathlib import Path
          token = os.environ["GH_DISPATCH_TOKEN"]
          assert token, "Missing GitHub dispatch token"
          p = Path(".dev.vars")
          p.write_text("V15_GITHUB_DISPATCH_TOKEN=" + repr(token) + "\n")
          p.chmod(0o600)
          PYSECRET

          cleanup() {
            kill "${SERVER_PID:-}" 2>/dev/null || true
            rm -f .dev.vars
          }
          trap cleanup EXIT

          npx --yes wrangler@4.149.0 dev --local --test-scheduled --ip 127.0.0.1 --port 8787 > /tmp/v15-cron-test.log 2>&1 &
          SERVER_PID=$!

          READY=0
          for i in $(seq 1 40); do
            if curl -fsS --max-time 1 http://127.0.0.1:8787/ >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" != 1 ]; then
            echo "V15_TEST_SERVER_FAILED"
            tail -30 /tmp/v15-cron-test.log
            exit 1
          fi

          curl -fsS --max-time 30 'http://127.0.0.1:8787/__scheduled?cron=%2A%2F5%20%2A%20%2A%20%2A%20%2A' >/dev/null

          for i in $(seq 1 20); do
            if grep -q 'V15_DISPATCH_ACCEPTED' /tmp/v15-cron-test.log; then
              echo "V15_REAL_DISPATCH_TEST_OK"
              exit 0
            fi
            if grep -q 'V15_DISPATCH_FAILED' /tmp/v15-cron-test.log; then
              grep 'V15_DISPATCH_FAILED' /tmp/v15-cron-test.log | tail -2
              exit 1
            fi
            sleep 2
          done

          echo "V15_DISPATCH_RESULT_MISSING"
          tail -25 /tmp/v15-cron-test.log
          exit 1

      - name: V15 cron deployed
        run: echo 'V15_CLOUDFLARE_CRON_DEPLOYED'

      - name: Test V15 scheduled dispatch
        working-directory: cloudflare/v15-cron
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
        run: |
          echo "V15_CRON_TEST_START"
          npx --yes wrangler@4.149.0 deployments list
          echo "V15_CRON_DEPLOYMENT_CHECK_OK"

      - name: Test actual V15 scheduled event
        working-directory: cloudflare/v15-cron
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
        run: |
          echo "V15_SCHEDULED_TEST_START"
          npx --yes wrangler@4.149.0 deployments list
          echo "V15_SCHEDULED_TEST_END"
