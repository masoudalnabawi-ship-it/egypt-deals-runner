name: Amazon Category Expansion

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Expand Amazon native categories
        run: |
          python - <<'PY'
          import re
          import html
          import urllib.request
          import urllib.error
          from urllib.parse import urljoin

          BASE = "https://www.amazon.eg"

          roots = [
              ("BESTSELLERS", BASE + "/gp/bestsellers"),
              ("NEW_RELEASES", BASE + "/gp/new-releases"),
          ]

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/140.0 Safari/537.36"
              ),
              "Accept-Language": "ar-EG,ar;q=0.9,en;q=0.8",
          }

          def fetch(url):
              req = urllib.request.Request(
                  url,
                  headers=headers
              )

              with urllib.request.urlopen(
                  req,
                  timeout=20
              ) as r:
                  return (
                      r.status,
                      r.read().decode(
                          "utf-8",
                          errors="ignore"
                      )
                  )

          grand_asins = set()
          total_pages = 0

          for root_name, root_url in roots:
              print()
              print("=" * 70)
              print("ROOT:", root_name)

              try:
                  status, body = fetch(root_url)
              except Exception as e:
                  print("ROOT ERROR:", repr(e))
                  continue

              root_asins = set(
                  re.findall(
                      r'data-asin=["\']([A-Z0-9]{10})',
                      body
                  )
              )

              grand_asins.update(root_asins)

              links = re.findall(
                  r'href=["\']([^"\']+)["\']',
                  body
              )

              category_urls = []

              for href in links:
                  href = html.unescape(href)

                  u = urljoin(
                      BASE,
                      href
                  )

                  if root_name == "BESTSELLERS":
                      wanted = "/gp/bestsellers/" in u
                  else:
                      wanted = "/gp/new-releases/" in u

                  if not wanted:
                      continue

                  if u.rstrip("/") == root_url.rstrip("/"):
                      continue

                  u = u.split("#")[0]

                  if u not in category_urls:
                      category_urls.append(u)

              print(
                  "ROOT HTTP =", status,
                  "| ROOT ASINS =", len(root_asins),
                  "| CATEGORY LINKS =", len(category_urls)
              )

              for i, url in enumerate(
                  category_urls[:15],
                  start=1
              ):
                  try:
                      st, page = fetch(url)

                      asins = set(
                          re.findall(
                              r'data-asin=["\']([A-Z0-9]{10})',
                              page
                          )
                      )

                      grand_asins.update(asins)
                      total_pages += 1

                      print(
                          f"{i:02d}",
                          "| HTTP =", st,
                          "| ASINS =", len(asins),
                          "|",
                          url[:120]
                      )

                  except Exception as e:
                      print(
                          f"{i:02d}",
                          "| ERROR =",
                          repr(e)
                      )

          print()
          print("=" * 70)
          print("CATEGORY PAGES TESTED =", total_pages)
          print("UNIQUE AMAZON ASINS =", len(grand_asins))

          if len(grand_asins) >= 100:
              print("✅ AMAZON NATIVE EXPANSION IS VIABLE")
          else:
              print("⚠️ AMAZON NATIVE EXPANSION IS LIMITED")
          PY
