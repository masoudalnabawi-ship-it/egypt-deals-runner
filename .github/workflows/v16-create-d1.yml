name: V16 Create D1 Database

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create or find V16 D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4 d1 create egypt-amazon-v16-db || {
            echo "Database creation failed or database already exists."
            exit 1
          }
