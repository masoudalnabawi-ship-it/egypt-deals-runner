name: Amazon V15 Real Screenshot Probe

on:
  push:
    branches:
      - amazon-v15-rebuild
    paths:
      - 'scripts/v15/**'
      - '.github/workflows/v15-live-probe.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout V15
        uses: actions/checkout@v4
        with:
          ref: amazon-v15-rebuild

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "playwright==1.56.0" requests
          python -m playwright install --with-deps chromium

      - name: Run V15 unit tests
        run: python -m unittest discover -s tests/v15 -q

      - name: V15 monitoring lease
        id: lease
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b015795e3322f02ca29cf8d8f1982212
        run: python scripts/v15/monitoring_cycle.py claim

      - name: Capture real Amazon evidence
        if: steps.lease.outputs.claimed == 'true'
        run: python scripts/v15/live_probe.py

      - name: Setup Node for Cloudflare
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare validated price observation
        if: steps.lease.outputs.claimed == 'true'
        run: |
          python scripts/v15/d1_price_observation.py \
            v15-live-evidence/verification.json \
            v15-live-evidence/price-observation.sql

      - name: Save price to V15 Cloudflare D1
        if: steps.lease.outputs.claimed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b015795e3322f02ca29cf8d8f1982212
        run: |
          set -euo pipefail

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "V15_D1_TOKEN_MISSING"
            exit 1
          fi

          npx --yes wrangler@4.149.0 d1 execute \
            egypt-amazon-v15-db \
            --remote \
            --file v15-live-evidence/price-observation.sql

          echo "V15_D1_PRICE_SAVED"

          npx --yes wrangler@4.149.0 d1 execute \
            egypt-amazon-v15-db \
            --remote \
            --command "SELECT asin, price, observed_at, source FROM price_observations ORDER BY observed_at DESC LIMIT 5;"

          echo "V15_D1_HISTORY_READ_OK"

      - name: Complete V15 monitoring after D1 save
        if: steps.lease.outputs.claimed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b015795e3322f02ca29cf8d8f1982212
          V15_LEASE_OWNER: ${{ steps.lease.outputs.owner }}
          V15_LEASE_PRIORITY: ${{ steps.lease.outputs.priority }}
        run: python scripts/v15/monitoring_cycle.py complete

      - name: Reschedule V15 after probe failure
        if: ${{ failure() && steps.lease.outputs.claimed == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b015795e3322f02ca29cf8d8f1982212
          V15_LEASE_OWNER: ${{ steps.lease.outputs.owner }}
          V15_LEASE_PRIORITY: ${{ steps.lease.outputs.priority }}
        run: python scripts/v15/monitoring_cycle.py fail

      - name: Upload screenshot and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-v15-real-evidence
          path: v15-live-evidence/
          if-no-files-found: warn
          retention-days: 7
