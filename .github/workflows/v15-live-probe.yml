name: Amazon V15 Real Screenshot Probe

on:
  push:
    branches:
      - amazon-v15-rebuild
    paths:
      - 'scripts/v15/**'
      - '.github/workflows/v15-live-probe.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      v15_d1_smoke:
        description: 'Run isolated V15 D1 dedup smoke test only (no product scan or Telegram)'
        required: false
        type: boolean
        default: false
      v15_webhook_migrate:
        description: 'Create V15 review tables only; no Worker deployment'
        required: false
        type: boolean
        default: false
      v15_webhook_activate:
        description: 'Activate private V15 Telegram webhook only'
        required: false
        type: boolean
        default: false
      v15_private_review_test:
        description: 'Send one private V15 review test; never publish publicly'
        required: false
        type: boolean
        default: false
      v15_webhook_deploy:
        description: 'Deploy private V15 Worker only; never activate Telegram webhook'
        required: false
        type: boolean
        default: false
      v15_webhook_preflight:
        description: 'Read-only D1 review schema and Telegram secrets presence; no product scan'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout V15
        uses: actions/checkout@v4
        with:
          ref: amazon-v15-rebuild

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: ${{ inputs.v15_d1_smoke != true && inputs.v15_webhook_preflight != true && inputs.v15_webhook_deploy != true && inputs.v15_private_review_test != true }}
        run: |
          python -m pip install --upgrade pip
          pip install "playwright==1.56.0" requests
          python -m playwright install --with-deps chromium

      - name: Run V15 unit tests
        run: python -m unittest discover -s tests/v15 -q

      - name: Setup Node for Cloudflare
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Inspect V15 Cloudflare Worker read-only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.v15_webhook_preflight == true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'CHECK'
          import json, os, urllib.request, urllib.error
          account = "b015795e3322f02ca29cf8d8f1982212"
          worker = "egypt-amazon-v15-telegram-webhook"
          base = f"https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/{worker}"
          headers = {"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"]}
          for label, url in [
              ("WORKER", base),
              ("SECRETS", base + "/secrets"),
          ]:
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=25) as r:
                      data = json.load(r)
                  if label == "SECRETS":
                      names = [x.get("name") for x in data.get("result", [])]
                      print("V15_WORKER_SECRET_NAMES:", names)
                  else:
                      print("V15_WORKER_EXISTS:", data.get("success"))
              except urllib.error.HTTPError as e:
                  print(f"V15_{label}_HTTP_STATUS:", e.code)
              except Exception as e:
                  print(f"V15_{label}_CHECK_ERROR:", type(e).__name__)
          CHECK

      - name: Inspect V15 Telegram webhook read-only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.v15_webhook_preflight == true }}
        env:
          V15_TELEGRAM_BOT_TOKEN: ${{ secrets.V15_TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'CHECK'
          import json, os, urllib.request
          token = os.environ["V15_TELEGRAM_BOT_TOKEN"]
          req = urllib.request.Request(
              "https://api.telegram.org/bot" + token + "/getWebhookInfo",
              method="POST"
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  result = json.load(response)
              info = result.get("result", {})
              print("V15_TELEGRAM_WEBHOOK_CONFIGURED:", bool(info.get("url")))
              print("V15_TELEGRAM_WEBHOOK_URL:", info.get("url") or "NONE")
              print("V15_TELEGRAM_PENDING_UPDATES:", info.get("pending_update_count", 0))
          except Exception:
              print("V15_TELEGRAM_WEBHOOK_CHECK_FAILED")
          CHECK

      - name: Activate V15 private Telegram webhook
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.v15_webhook_activate == true }}
        env:
          V15_TELEGRAM_BOT_TOKEN: ${{ secrets.V15_TELEGRAM_BOT_TOKEN }}
          V15_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.V15_TELEGRAM_WEBHOOK_SECRET }}
        run: |
          python3 - <<'ACTIVATE'
          import json, os, urllib.parse, urllib.request
          token = os.environ["V15_TELEGRAM_BOT_TOKEN"]
          secret = os.environ["V15_TELEGRAM_WEBHOOK_SECRET"]
          target = "https://egypt-amazon-v15-telegram-webhook.masoud-amazon-eg.workers.dev/"
          base = "https://api.telegram.org/bot" + token + "/"

          def call(method, data=None):
              body = urllib.parse.urlencode(data).encode() if data else None
              req = urllib.request.Request(base + method, data=body)
              with urllib.request.urlopen(req, timeout=25) as response:
                  return json.load(response)

          current = call("getWebhookInfo")["result"].get("url", "")
          if current and current != target:
              raise SystemExit("V15_WEBHOOK_ACTIVATION_BLOCKED_EXISTING_URL")

          result = call("setWebhook", {
              "url": target,
              "secret_token": secret,
              "drop_pending_updates": "false",
              "allowed_updates": json.dumps(["message", "callback_query"])
          })
          assert result.get("ok"), "V15_WEBHOOK_ACTIVATION_FAILED"

          verified = call("getWebhookInfo")["result"]
          assert verified.get("url") == target, "V15_WEBHOOK_URL_MISMATCH"
          print("V15_PRIVATE_TELEGRAM_WEBHOOK_ACTIVATED")
          print("V15_PUBLIC_POSTING_NOT_ENABLED")
          ACTIVATE

      - name: Deploy V15 private Telegram Worker
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.v15_webhook_deploy == true }}
        working-directory: cloudflare/v15-telegram-webhook
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b015795e3322f02ca29cf8d8f1982212
          V15_TELEGRAM_BOT_TOKEN: ${{ secrets.V15_TELEGRAM_BOT_TOKEN }}
          V15_TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.V15_TELEGRAM_REVIEW_CHAT_ID }}
          V15_TELEGRAM_OWNER_USER_ID: ${{ secrets.V15_TELEGRAM_OWNER_USER_ID }}
          V15_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.V15_TELEGRAM_WEBHOOK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f /tmp/v15-worker-secrets.json' EXIT
          node --test ../../tests/webhook.test.mjs
          for k in CLOUDFLARE_API_TOKEN V15_TELEGRAM_BOT_TOKEN V15_TELEGRAM_REVIEW_CHAT_ID V15_TELEGRAM_OWNER_USER_ID V15_TELEGRAM_WEBHOOK_SECRET; do
            test -n "${!k:-}" || { echo "MISSING_SECRET:$k"; exit 1; }
          done
          export BOT_USER_ID=$(python3 -c 'import json,os,urllib.request; u="https://api.telegram.org/bot"+os.environ["V15_TELEGRAM_BOT_TOKEN"]+"/getMe"; d=json.load(urllib.request.urlopen(u,timeout=20)); assert d["ok"]; print(d["result"]["id"])')
          python3 -c 'import json,os; print(json.dumps({
            "TELEGRAM_BOT_TOKEN":os.environ["V15_TELEGRAM_BOT_TOKEN"],
            "TELEGRAM_WEBHOOK_SECRET":os.environ["V15_TELEGRAM_WEBHOOK_SECRET"],
            "OWNER_USER_ID":os.environ["V15_TELEGRAM_OWNER_USER_ID"],
            "REVIEW_CHAT_ID":os.environ["V15_TELEGRAM_REVIEW_CHAT_ID"],
            "BOT_USER_ID":os.environ["BOT_USER_ID"]
          }))' > /tmp/v15-worker-secrets.json
          npx --yes wrangler@4.149.0 deploy
          npx --yes wrangler@4.149.0 secret bulk /tmp/v15-worker-secrets.json
          rm -f /tmp/v15-worker-secrets.json
          echo 'V15_WORKER_DEPLOYED_NO_TELEGRAM_WEBHOOK_ACTIVATION'

      - name: Send V15 private review test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.v15_private_review_test == true }}
        env:
          V15_TELEGRAM_BOT_TOKEN: ${{ secrets.V15_TELEGRAM_BOT_TOKEN }}
          V15_TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.V15_TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          python3 - <<'TEST'
          import json, os, urllib.parse, urllib.request

          asin = 'B000000001'
          token = os.environ['V15_TELEGRAM_BOT_TOKEN']
          chat = os.environ['V15_TELEGRAM_REVIEW_CHAT_ID']

          buttons = {'inline_keyboard': [
            [{'text': '🛒 فتح المنتج', 'url': 'https://www.amazon.eg/dp/' + asin}],
            [{'text': '🚀 طلب نشر (تجريبي)', 'callback_data': 'v15:publish:' + asin},
             {'text': '✏️ تعديل / رسالة مخصصة', 'callback_data': 'v15:edit:' + asin}],
            [{'text': '🔍 انتظار التحقق', 'callback_data': 'v15:wait:' + asin},
             {'text': '❌ تجاهل', 'callback_data': 'v15:ignore:' + asin}]
          ]}

          data = urllib.parse.urlencode({
            'chat_id': chat,
            'text': '🧪 عرض تجريبي V15 — ليس عرضًا حقيقيًا\n'
                    '📦 ASIN: ' + asin + '\n'
                    '🔒 اختبار خاص فقط؛ لا نشر عام.',
            'reply_markup': json.dumps(buttons, ensure_ascii=False)
          }).encode()

          req = urllib.request.Request(
            'https://api.telegram.org/bot' + token + '/sendMessage',
            data=data, method='POST'
          )

          with urllib.request.urlopen(req, timeout=20) as response:
            result = json.load(response)

          assert result.get('ok'), 'PRIVATE_REVIEW_TEST_FAILED'
          print('V15_PRIVATE_REVIEW_TEST_SENT')
          print('V15_PUBLIC_POSTING_NOT_ENABLED')
          TEST

      - name: V15 review draft status read-only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.v15_webhook_preflight == true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b015795e3322f02ca29cf8d8f1982212
        run: |
          npx --yes wrangler@4.149.0 d1 execute egypt-amazon-v15-db --remote --command "SELECT asin,status,updated_at FROM v15_review_drafts WHERE asin='B000000001';"
      - name: V15 webhook schema migration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.v15_webhook_migrate == true && inputs.v15_webhook_deploy != true && inputs.v15_private_review_test != true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b015795e3322f02ca29cf8d8f1982212
        run: |
          set -euo pipefail
          npx --yes wrangler@4.149.0 d1 execute egypt-amazon-v15-db --remote --file cloudflare/v15-telegram-webhook/schema.sql
          echo 'V15_REVIEW_SCHEMA_CREATED'

      - name: V15 webhook read-only preflight
        if: ${{ inputs.v15_webhook_preflight == true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b015795e3322f02ca29cf8d8f1982212
          V15_TELEGRAM_BOT_TOKEN: ${{ secrets.V15_TELEGRAM_BOT_TOKEN }}
          V15_TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.V15_TELEGRAM_REVIEW_CHAT_ID }}
          V15_TELEGRAM_OWNER_USER_ID: ${{ secrets.V15_TELEGRAM_OWNER_USER_ID }}
          V15_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.V15_TELEGRAM_WEBHOOK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'MISSING_CLOUDFLARE_TOKEN'; exit 1; }
          for k in V15_TELEGRAM_BOT_TOKEN V15_TELEGRAM_REVIEW_CHAT_ID V15_TELEGRAM_OWNER_USER_ID V15_TELEGRAM_WEBHOOK_SECRET; do
            if [ -z "${!k:-}" ]; then echo "MISSING_SECRET:$k"; else echo "SECRET_PRESENT:$k"; fi
          done
          npx --yes wrangler@4.149.0 d1 execute egypt-amazon-v15-db --remote --command "SELECT name,sql FROM sqlite_master WHERE type='table' AND name LIKE 'v15_review_%' ORDER BY name;"
          echo 'V15_WEBHOOK_PREFLIGHT_READ_ONLY_COMPLETE'

      - name: V15 D1 dedup isolated smoke test
        if: ${{ inputs.v15_d1_smoke == true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b015795e3322f02ca29cf8d8f1982212
        run: python scripts/v15/d1_smoke.py

      - name: V15 private Telegram connection test
        if: ${{ false }} # Disabled: avoid repeated Telegram diagnostic messages
        continue-on-error: true
        env:
          V15_TELEGRAM_BOT_TOKEN: ${{ secrets.V15_TELEGRAM_BOT_TOKEN }}
          V15_TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.V15_TELEGRAM_REVIEW_CHAT_ID }}
        run: python scripts/v15/telegram_diagnostic.py

      - name: V15 D1 database ID discovery
        if: github.event_name == 'workflow_dispatch' && inputs.v15_webhook_preflight != true && inputs.v15_webhook_deploy != true && inputs.v15_private_review_test != true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b015795e3322f02ca29cf8d8f1982212
        run: npx --yes wrangler@4.149.0 d1 list --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print("V15_D1_DATABASE_ID", next(x["uuid"] for x in d if x["name"]=="egypt-amazon-v15-db"))'

      - name: V15 category discovery
        if: ${{ inputs.v15_d1_smoke != true && inputs.v15_webhook_preflight != true && inputs.v15_webhook_deploy != true && inputs.v15_private_review_test != true }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b015795e3322f02ca29cf8d8f1982212
        run: python scripts/v15/category_discovery.py

      - name: V15 batch monitoring (up to 20 independent products)
        if: ${{ inputs.v15_d1_smoke != true && inputs.v15_webhook_preflight != true && inputs.v15_webhook_deploy != true && inputs.v15_private_review_test != true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b015795e3322f02ca29cf8d8f1982212
          V15_BATCH_SIZE: '20'
          V15_BATCH_WORKERS: '4'
          V15_TELEGRAM_BOT_TOKEN: ${{ secrets.V15_TELEGRAM_BOT_TOKEN }}
          V15_TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.V15_TELEGRAM_REVIEW_CHAT_ID }}
        run: python scripts/v15/batch_monitor.py

      - name: Upload screenshot and verification evidence
        if: ${{ inputs.v15_d1_smoke != true && inputs.v15_webhook_preflight != true && inputs.v15_webhook_deploy != true && inputs.v15_private_review_test != true && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: amazon-v15-real-evidence
          path: |
            v15-live-evidence/
            v15-flash-candidates/
          if-no-files-found: warn
          retention-days: 7
