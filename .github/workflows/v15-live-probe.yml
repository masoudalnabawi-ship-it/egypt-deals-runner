name: Amazon V15 Real Screenshot Probe

on:
  push:
    branches:
      - amazon-v15-rebuild
    paths:
      - 'scripts/v15/**'
      - '.github/workflows/v15-live-probe.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout V15
        uses: actions/checkout@v4
        with:
          ref: amazon-v15-rebuild

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "playwright==1.56.0" requests
          python -m playwright install --with-deps chromium

      - name: Run V15 unit tests
        run: python -m unittest discover -s tests/v15 -q

      - name: Setup Node for Cloudflare
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: V15 category discovery
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b015795e3322f02ca29cf8d8f1982212
        run: python scripts/v15/category_discovery.py

      - name: V15 batch monitoring (up to 5 independent products)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b015795e3322f02ca29cf8d8f1982212
          V15_BATCH_SIZE: '5'
        run: python scripts/v15/batch_monitor.py

      - name: V15 private Telegram connection test
        if: github.event_name == 'workflow_dispatch'
        env:
          BOT_TOKEN: ${{ secrets.V15_TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.V15_TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          python3 - <<'TELEGRAM_PY'
          import json, os, urllib.parse, urllib.request
          token = os.environ["BOT_TOKEN"]
          chat_id = os.environ["CHAT_ID"]
          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": "⚡ Egypt Deal Hunter V15\\n✅ الاتصال ناجح!\\n🔒 النشر العام غير مفعّل."
          }).encode()
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=data, method="POST"
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  result = json.load(response)
              if not result.get("ok"):
                  raise RuntimeError("Telegram rejected message")
              print("V15_TELEGRAM_PRIVATE_TEST_SUCCESS")
          except Exception:
              print("V15_TELEGRAM_PRIVATE_TEST_FAILED")
              raise SystemExit(1)
          TELEGRAM_PY

      - name: Upload screenshot and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-v15-real-evidence
          path: |
            v15-live-evidence/
            v15-flash-candidates/
          if-no-files-found: warn
          retention-days: 7
