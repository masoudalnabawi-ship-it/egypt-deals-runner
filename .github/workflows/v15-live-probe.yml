name: Amazon V15 Real Screenshot Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout V15
        uses: actions/checkout@v4
        with:
          ref: amazon-v15-rebuild

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "playwright==1.56.0" requests
          python -m playwright install --with-deps chromium

      - name: Run V15 unit tests
        run: python -m unittest discover -s tests/v15 -q

      - name: Capture real Amazon evidence
        run: python scripts/v15/live_probe.py

      - name: Upload screenshot and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-v15-real-evidence
          path: v15-live-evidence/
          if-no-files-found: warn
          retention-days: 7
