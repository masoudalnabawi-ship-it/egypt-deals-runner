name: Amazon V15 Real Screenshot Probe

on:
  push:
    branches:
      - amazon-v15-rebuild
    paths:
      - 'scripts/v15/**'
      - '.github/workflows/v15-live-probe.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      v15_d1_smoke:
        description: 'Run isolated V15 D1 dedup smoke test only (no product scan or Telegram)'
        required: false
        type: boolean
        default: false
      v15_webhook_migrate:
        description: 'Create V15 review tables only; no Worker deployment'
        required: false
        type: boolean
        default: false
      v15_webhook_preflight:
        description: 'Read-only D1 review schema and Telegram secrets presence; no product scan'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout V15
        uses: actions/checkout@v4
        with:
          ref: amazon-v15-rebuild

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: ${{ inputs.v15_d1_smoke != true && inputs.v15_webhook_preflight != true }}
        run: |
          python -m pip install --upgrade pip
          pip install "playwright==1.56.0" requests
          python -m playwright install --with-deps chromium

      - name: Run V15 unit tests
        run: python -m unittest discover -s tests/v15 -q

      - name: Setup Node for Cloudflare
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: V15 webhook schema migration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.v15_webhook_migrate == true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b015795e3322f02ca29cf8d8f1982212
        run: |
          set -euo pipefail
          npx --yes wrangler@4.149.0 d1 execute egypt-amazon-v15-db --remote --file cloudflare/v15-telegram-webhook/schema.sql
          echo 'V15_REVIEW_SCHEMA_CREATED'

      - name: V15 webhook read-only preflight
        if: ${{ inputs.v15_webhook_preflight == true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b015795e3322f02ca29cf8d8f1982212
          V15_TELEGRAM_BOT_TOKEN: ${{ secrets.V15_TELEGRAM_BOT_TOKEN }}
          V15_TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.V15_TELEGRAM_REVIEW_CHAT_ID }}
          V15_TELEGRAM_OWNER_USER_ID: ${{ secrets.V15_TELEGRAM_OWNER_USER_ID }}
          V15_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.V15_TELEGRAM_WEBHOOK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'MISSING_CLOUDFLARE_TOKEN'; exit 1; }
          for k in V15_TELEGRAM_BOT_TOKEN V15_TELEGRAM_REVIEW_CHAT_ID V15_TELEGRAM_OWNER_USER_ID V15_TELEGRAM_WEBHOOK_SECRET; do
            if [ -z "${!k:-}" ]; then echo "MISSING_SECRET:$k"; else echo "SECRET_PRESENT:$k"; fi
          done
          npx --yes wrangler@4.149.0 d1 execute egypt-amazon-v15-db --remote --command "SELECT name,sql FROM sqlite_master WHERE type='table' AND name LIKE 'v15_review_%' ORDER BY name;"
          echo 'V15_WEBHOOK_PREFLIGHT_READ_ONLY_COMPLETE'

      - name: V15 D1 dedup isolated smoke test
        if: ${{ inputs.v15_d1_smoke == true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b015795e3322f02ca29cf8d8f1982212
        run: python scripts/v15/d1_smoke.py

      - name: V15 private Telegram connection test
        if: ${{ inputs.v15_d1_smoke != true && inputs.v15_webhook_preflight != true && github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        env:
          V15_TELEGRAM_BOT_TOKEN: ${{ secrets.V15_TELEGRAM_BOT_TOKEN }}
          V15_TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.V15_TELEGRAM_REVIEW_CHAT_ID }}
        run: python scripts/v15/telegram_diagnostic.py

      - name: V15 D1 database ID discovery
        if: github.event_name == 'workflow_dispatch' && inputs.v15_webhook_preflight != true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b015795e3322f02ca29cf8d8f1982212
        run: npx --yes wrangler@4.149.0 d1 list --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print("V15_D1_DATABASE_ID", next(x["uuid"] for x in d if x["name"]=="egypt-amazon-v15-db"))'

      - name: V15 category discovery
        if: ${{ inputs.v15_d1_smoke != true && inputs.v15_webhook_preflight != true }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b015795e3322f02ca29cf8d8f1982212
        run: python scripts/v15/category_discovery.py

      - name: V15 batch monitoring (up to 5 independent products)
        if: ${{ inputs.v15_d1_smoke != true && inputs.v15_webhook_preflight != true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b015795e3322f02ca29cf8d8f1982212
          V15_BATCH_SIZE: '5'
          V15_TELEGRAM_BOT_TOKEN: ${{ secrets.V15_TELEGRAM_BOT_TOKEN }}
          V15_TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.V15_TELEGRAM_REVIEW_CHAT_ID }}
        run: python scripts/v15/batch_monitor.py

      - name: Upload screenshot and verification evidence
        if: ${{ inputs.v15_d1_smoke != true && inputs.v15_webhook_preflight != true && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: amazon-v15-real-evidence
          path: |
            v15-live-evidence/
            v15-flash-candidates/
          if-no-files-found: warn
          retention-days: 7
