name: Talabat Mart Automatic Scanner

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: talabat-mart-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: cloudflare_amazon_v14

    steps:
      - uses: actions/checkout@v4
        with:
          ref: used-probe-test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan all Talabat categories
        run: |
          set -o pipefail
          python3 -u scripts/talabat_branch_scan.py \
            | tee reports/talabat_auto_scan.log

      - name: Validate scan coverage
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          d = json.loads(Path(
              "reports/talabat_multi_branch.json"
          ).read_text(encoding="utf-8"))

          branches = d.get("branches", [])
          pages = sum(int(x.get("pages_checked", 0)) for x in branches)
          offers = len(d.get("offers", []))

          print("BRANCHES:", len(branches))
          print("PAGES:", pages)
          print("OFFERS_40_PLUS:", offers)

          if len(branches) != 3 or pages < 600:
              raise SystemExit("INCOMPLETE_SCAN")

          print("SCAN_VALIDATED")
          PY

      - name: Recheck prices and stock
        run: python3 -u scripts/talabat_recheck.py

      - name: Send new rechecked deals to Talabat private review
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          REVIEW_WORKER_URL: https://egypt-talabat-review.masoud-amazon-eg.workers.dev
        run: |
          python3 - <<'CHECK'
          import json
          from pathlib import Path
          data=json.loads(Path('reports/talabat_rechecked.json').read_text())
          good=[x for x in data if x.get('recheck_status')=='PRICE_STOCK_CONFIRMED'
                and float(x.get('live_stock') or 0)>0
                and float(x.get('live_discount') or 0)>=40]
          print('RECHECKED_OFFERS:',len(good))
          Path('reports/talabat_eligible.flag').write_text(str(len(good)))
          CHECK
          if [ "$(cat reports/talabat_eligible.flag)" = '0' ]; then
            echo 'NO_ELIGIBLE_OFFERS'
            exit 0
          fi
          test -n "$TELEGRAM_BOT_TOKEN" || { echo BOT_TOKEN_MISSING; exit 1; }
          python3 -m pip install -q playwright requests
          python3 -m playwright install --with-deps chromium >/dev/null
          python3 -u scripts/talabat_dynamic_review.py

      - name: Save reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talabat-scan-${{ github.run_id }}
          path: |
            cloudflare_amazon_v14/reports/talabat_multi_branch.json
            cloudflare_amazon_v14/reports/talabat_rechecked.json
            cloudflare_amazon_v14/reports/talabat_auto_scan.log
          retention-days: 7
          if-no-files-found: warn
