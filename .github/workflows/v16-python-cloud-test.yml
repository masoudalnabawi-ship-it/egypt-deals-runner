name: V16 Python Cloud Connection Test

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v16-smart-dedup-20261013203210
    paths:
      - .github/workflows/v16-python-cloud-test.yml

permissions:
  contents: read

jobs:
  test-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Test Python curl connection to Cloudflare D1
        env:
          V16_WORKER_URL: ${{ vars.V16_WORKER_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          V16_REGISTRATION_SECRET: ${{ secrets.V16_REGISTRATION_SECRET }}
          PYTHONPATH: scripts/v16
        run: |
          set -euo pipefail
          echo "V16_WORKER_DIAGNOSTICS"
          cd cloudflare/v16-telegram-webhook
          cp wrangler.toml.template wrangler.toml
          timeout 25s npx --yes wrangler@4 tail egypt-amazon-v16-telegram-webhook --format json > /tmp/v16-tail.log 2>/tmp/v16-tail-error.log &
          TAIL_PID=$!
          cd ../..
          sleep 10
          curl -sS -o /dev/null -X POST "$V16_WORKER_URL/dedup/check" \
            -H "Authorization: Bearer $V16_REGISTRATION_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"asin":"B0TEST1234","price_cents":10000}' || true
          wait "$TAIL_PID" || true
          echo "=== V16 TAIL CONNECTION STATUS ==="
          grep -Ei 'error|failed|unauthorized|forbidden|connected|tail' /tmp/v16-tail-error.log | tail -12 || true
          echo "=== V16 TAIL EVENT COUNT ==="
          wc -l /tmp/v16-tail.log
          python3 - <<'LOG'
          import json
          from pathlib import Path
          for line in Path('/tmp/v16-tail.log').read_text().splitlines():
              try:
                  event = json.loads(line)
                  for item in event.get('logs', []):
                      message = ' '.join(map(str, item.get('message', [])))
                      if 'V16_WEBHOOK_FAILED' in message:
                          print('V16_ACTUAL_ERROR:', message[:500])
              except (ValueError, TypeError):
                  continue
          LOG

          python3 - <<'PY'
          import uuid
          from cloud_dedup import request

          asin = 'B0' + uuid.uuid4().hex[:8].upper()
          import subprocess

          try:
              result = request('/dedup/check', {
                  'asin': asin,
                  'price_cents': 10000,
              })
          except subprocess.CalledProcessError as exc:
              print('HTTP_ERROR_EXIT_CODE:', exc.returncode)
              print('WORKER_RESPONSE:', (exc.stdout or '')[:500])
              raise RuntimeError('V16_WORKER_REQUEST_FAILED') from None

          assert result.get('duplicate') is False, result
          print('V16_PYTHON_CLOUDFLARE_CONNECTION_PASSED')

          from worker_price_history import record_price, historical_discount

          test_asin = 'B0' + uuid.uuid4().hex[:8].upper()
          test_price = 999.99

          assert record_price(test_asin, test_price), 'PRICE_RECORD_FAILED'
          print('PASS: V16 price recorded in D1')

          result = historical_discount(test_asin, test_price)
          assert result is None, 'UNVERIFIED_DISCOUNT_ACCEPTED'
          print('PASS: Unverified discount rejected')

          print('V16_PRICE_HISTORY_LIVE_PASSED')
          PY
