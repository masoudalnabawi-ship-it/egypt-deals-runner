name: Talabat First Real Offer

on:
  push:
    branches: [used-probe-test]
    paths:
      - 'cloudflare_amazon_v14/talabat_alerts/first_offer.json'
      - '.github/workflows/talabat-first-offer.yml'

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send photo offer
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: "-1004375874566"
        run: |
          python3 - <<'SENDPY'
          import json, os, time, urllib.request
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          x = json.loads(Path(
              "cloudflare_amazon_v14/talabat_alerts/first_offer.json"
          ).read_text(encoding="utf-8"))

          token = os.environ["BOT_TOKEN"]
          chat_id = os.environ["CHAT_ID"]

          checked = datetime.fromtimestamp(
              int(x["checked_at"]),
              timezone(timedelta(hours=2))
          ).strftime("%d-%m-%Y %H:%M")

          caption = (
              f"🛒 طلبات مارت | {x['area']}\n\n"
              f"📦 {x['title']}\n"
              f"💰 {x['price']} جنيه\n"
              f"🔥 خصم {x['discount']}%\n"
              f"📦 مخزون الصفحة: {x['stock']}\n"
              f"🕒 تحقق: {checked}\n\n"
              "✅ السعر والمخزون مطابقان وقت الفحص\n"
              "⚠️ التوصيل والسعر النهائي غير مؤكدين"
          )

          data = json.dumps({
              "chat_id": chat_id,
              "photo": x["image"],
              "caption": caption,
              "reply_markup": {
                  "inline_keyboard": [
                      [
                          {"text": "فتح المنتج (تجريبي)", "url": x["product_link"]},
                          {"text": "فتح القسم", "url": x["category_link"]}
                      ]
                  ]
              }
          }, ensure_ascii=False).encode("utf-8")

          req = urllib.request.Request(
              "https://api.telegram.org/bot" + token + "/sendPhoto",
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          with urllib.request.urlopen(req, timeout=25) as r:
              result = json.load(r)

          if not result.get("ok"):
              raise SystemExit("TELEGRAM_SEND_FAILED")

          print("TALABAT_PHOTO_OFFER: SUCCESS")
          SENDPY
