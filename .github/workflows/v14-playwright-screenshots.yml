name: V14 Amazon Playwright Screenshots

on:
  workflow_dispatch:
  schedule:
    - cron: "13 */4 * * *"

permissions:
  contents: read

concurrency:
  group: v14-amazon-playwright-screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 235

    env:
      V14_WORKER_URL: https://egypt-deals-v14.masoudalnabawi.workers.dev
      V14_ADMIN_KEY: ${{ secrets.V14_ADMIN_KEY }}

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      AMAZON_NORMAL_REVIEW_CHAT_ID: ${{ secrets.AMAZON_NORMAL_REVIEW_CHAT_ID }}
      AMAZON_REVIEW_GROUP_ID: ${{ secrets.AMAZON_REVIEW_GROUP_ID }}

      V14_SCREENSHOT_WORKER_SECONDS: "13200"
      V14_SCREENSHOT_MIN_GAP: "1.5"

    steps:
      - name: Checkout V14
        uses: actions/checkout@v4
        with:
          ref: v14-cloudflare

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install worker dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "httpx>=0.27,<1" "playwright>=1.55,<2"

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Validate worker
        run: |
          python -m py_compile scripts/v14_screenshot_worker.py

      - name: Run V14 screenshot worker
        run: |
          python scripts/v14_screenshot_worker.py
