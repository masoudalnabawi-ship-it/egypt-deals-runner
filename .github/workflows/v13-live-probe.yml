name: V13 Live Probe

on:
  push:
    branches: [v13-rebuild]
    paths:
      - "deals_v13/**"
      - "scripts/v13_live_probe.py"
      - "requirements-v13.txt"
      - ".github/workflows/v13-live-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUD_API_URL: ${{ secrets.CLOUD_API_URL }}
      CLOUD_API_KEY: ${{ secrets.CLOUD_API_KEY }}
      V13_AMAZON_PROXY_FIRST: "false"
      V13_NOON_PROXY_FIRST: "true"
      V13_NOON_BROWSER_FALLBACK: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-v13.txt
      - name: Install Playwright Python
        run: python -m pip install "playwright>=1.55,<2"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests/v13 -p 'test_*.py' -v
      - name: No-send live probe
        run: PYTHONPATH=. python scripts/v13_live_probe.py --surfaces 3 --verify 3 --out v13-live-probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v13-live-probe
          path: v13-live-probe.json
          if-no-files-found: ignore
