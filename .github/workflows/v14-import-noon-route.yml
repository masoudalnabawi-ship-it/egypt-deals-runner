name: V14 Import Noon Route

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    env:
      BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      NOON_CHAT: ${{ secrets.NOON_REVIEW_BOT_CHAT_ID }}

    steps:
      - name: Securely transfer Noon review route
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import time
          import hmac
          import hashlib
          import json
          import urllib.request
          import urllib.error

          token = os.environ["BOT_TOKEN"].strip()
          chat = os.environ["NOON_CHAT"].strip()

          if not token or not chat:
              raise SystemExit(
                  "Required GitHub secret is missing"
              )

          ts = str(int(time.time()))

          sig = hmac.new(
              token.encode(),
              f"{chat}|{ts}".encode(),
              hashlib.sha256,
          ).hexdigest()

          payload = json.dumps({
              "chat_id": chat,
              "ts": int(ts),
              "signature": sig,
          }).encode()

          req = urllib.request.Request(
              "https://egypt-deals-v14.masoudalnabawi.workers.dev/internal/import-noon-route",
              data=payload,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(
                  req,
                  timeout=30,
              ) as r:
                  result = json.loads(r.read())

                  if not result.get("ok"):
                      raise SystemExit(
                          "Route import was not accepted"
                      )

                  print("NOON_ROUTE_IMPORT_OK")

          except urllib.error.HTTPError as e:
              body = e.read().decode(
                  "utf-8",
                  errors="ignore",
              )

              print(
                  "NOON_ROUTE_IMPORT_FAILED",
                  e.code,
                  body,
              )

              raise
          PY
