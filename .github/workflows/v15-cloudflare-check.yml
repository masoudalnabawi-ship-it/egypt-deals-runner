name: Amazon V15 Cloudflare Check

on:
  push:
    branches:
      - amazon-v15-rebuild
    paths:
      - '.github/workflows/v15-cloudflare-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout V15
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check Wrangler
        run: npx --yes wrangler@4.149.0 --version

      - name: Check Cloudflare authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "V15_CLOUDFLARE_CREDENTIALS_MISSING"
            exit 1
          fi

          npx --yes wrangler@4.149.0 d1 list
