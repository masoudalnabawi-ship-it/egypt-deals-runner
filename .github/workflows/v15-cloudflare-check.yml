name: Amazon V15 Cloudflare Check

on:
  workflow_dispatch:
    inputs:
      priority_index_only:
        description: 'Verify V15 priority index only'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check-cloudflare:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.priority_index_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout V15
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check Wrangler
        run: npx --yes wrangler@4.149.0 --version

      - name: Check Cloudflare authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b015795e3322f02ca29cf8d8f1982212
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "V15_CLOUDFLARE_CREDENTIALS_MISSING"
            exit 1
          fi

          echo "V15_SCHEMA_APPLYING"
          npx --yes wrangler@4.149.0 d1 execute egypt-amazon-v15-db --remote --file cloudflare_amazon_v15/migrations/0001_initial.sql
          echo "V15_SCHEMA_APPLIED"

          echo "V15_SCHEMA_VERIFYING"
          npx --yes wrangler@4.149.0 d1 execute egypt-amazon-v15-db --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('price_observations','delivery_state','competitor_signals') ORDER BY name;"
          echo "V15_SCHEMA_VERIFIED"

          npx --yes wrangler@4.149.0 d1 list --json > /tmp/v15-d1-list.json

          if node -e '
            const fs = require("fs");
            const dbs = JSON.parse(fs.readFileSync("/tmp/v15-d1-list.json", "utf8"));
            process.exit(dbs.some(db => db.name === "egypt-amazon-v15-db") ? 0 : 1);
          '; then
            echo "V15_DATABASE_ALREADY_EXISTS"
          else
            echo "V15_DATABASE_CREATING"
            npx --yes wrangler@4.149.0 d1 create egypt-amazon-v15-db
            echo "V15_DATABASE_CREATED"
          fi

          npx --yes wrangler@4.149.0 d1 list

      - name: Apply V15 monitoring migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b015795e3322f02ca29cf8d8f1982212
        run: |
          set -euo pipefail

          npx --yes wrangler@4.149.0 d1 execute \
            egypt-amazon-v15-db \
            --remote \
            --file cloudflare_amazon_v15/migrations/0002_product_monitoring.sql

          echo "V15_MONITORING_SCHEMA_APPLIED"

          npx --yes wrangler@4.149.0 d1 execute \
            egypt-amazon-v15-db \
            --remote \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name='product_monitoring';"

          echo "V15_MONITORING_SCHEMA_VERIFIED"

      - name: Test V15 leasing on remote D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b015795e3322f02ca29cf8d8f1982212
        run: |
          set -euo pipefail
          python scripts/v15/d1_lease_integration.py

      - name: Test V15 concurrent D1 leasing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b015795e3322f02ca29cf8d8f1982212
        run: |
          set -euo pipefail
          python scripts/v15/d1_concurrency_test.py

      - name: Register first V15 monitored product
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b015795e3322f02ca29cf8d8f1982212
        run: |
          set -euo pipefail
          npx --yes wrangler@4.149.0 d1 execute \
            egypt-amazon-v15-db \
            --remote \
            --file cloudflare_amazon_v15/migrations/0003_seed_monitoring.sql
          echo "V15_FIRST_PRODUCT_REGISTERED"

      - name: Validate V15 production leasing module
        run: |
          python -m py_compile scripts/v15/d1_monitoring_lease.py
          python scripts/v15/d1_monitoring_lease.py

      - name: Test production lease against V15 D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b015795e3322f02ca29cf8d8f1982212
        run: python scripts/v15/test_production_lease.py

      - name: Diagnose V15 product monitoring state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b015795e3322f02ca29cf8d8f1982212
        run: |
          npx --yes wrangler@4.149.0 d1 execute egypt-amazon-v15-db --remote --command "SELECT asin, priority, last_checked_at, next_check_at, consecutive_errors, lease_owner, lease_until FROM product_monitoring WHERE asin='B0DK4Z4GPJ';"

      - name: Test V15 monitoring dispatcher
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b015795e3322f02ca29cf8d8f1982212
        run: |
          set -euo pipefail
          python scripts/v15/monitoring_dispatcher.py

  priority-index-only:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.priority_index_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify existing V15 priority index
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b015795e3322f02ca29cf8d8f1982212
        run: |
          set -euo pipefail
          echo "V15_INDEX_READ_ONLY_VERIFICATION"
          npx --yes wrangler@4.149.0 d1 execute \
            egypt-amazon-v15-db \
            --remote \
            --command "SELECT name FROM sqlite_master WHERE type='index' AND name='idx_v15_priority_due';" \
            --json > /tmp/v15-index.json

          python3 - <<'VERIFY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/v15-index.json").read_text())
          items = data if isinstance(data, list) else [data]

          found = any(
              isinstance(item, dict)
              and item.get("success") is True
              and any(
                  isinstance(row, dict)
                  and row.get("name") == "idx_v15_priority_due"
                  for row in item.get("results", [])
              )
              for item in items
          )

          if not found:
              raise SystemExit("V15_PRIORITY_INDEX_NOT_CONFIRMED")

          print("V15_REMOTE_PRIORITY_INDEX_CONFIRMED")
          VERIFY
