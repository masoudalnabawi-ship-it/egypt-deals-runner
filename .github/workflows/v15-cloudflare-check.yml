name: Amazon V15 Cloudflare Check

on:
  push:
    branches:
      - amazon-v15-rebuild
    paths:
      - '.github/workflows/v15-cloudflare-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout V15
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check Wrangler
        run: npx --yes wrangler@4.149.0 --version

      - name: Check Cloudflare authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.V15_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b015795e3322f02ca29cf8d8f1982212
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "V15_CLOUDFLARE_CREDENTIALS_MISSING"
            exit 1
          fi

          npx --yes wrangler@4.149.0 d1 list --json > /tmp/v15-d1-list.json

          if node -e '
            const fs = require("fs");
            const dbs = JSON.parse(fs.readFileSync("/tmp/v15-d1-list.json", "utf8"));
            process.exit(dbs.some(db => db.name === "egypt-amazon-v15-db") ? 0 : 1);
          '; then
            echo "V15_DATABASE_ALREADY_EXISTS"
          else
            echo "V15_DATABASE_CREATING"
            npx --yes wrangler@4.149.0 d1 create egypt-amazon-v15-db
            echo "V15_DATABASE_CREATED"
          fi

          npx --yes wrangler@4.149.0 d1 list
