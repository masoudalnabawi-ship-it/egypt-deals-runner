name: V12 Amazon Realtime

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v12-amazon-realtime
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      AMAZON_NORMAL_REVIEW_CHAT_ID: ${{ secrets.AMAZON_NORMAL_REVIEW_CHAT_ID }}
      AMAZON_REVIEW_GROUP_ID: ${{ secrets.AMAZON_REVIEW_GROUP_ID }}

      V12_AMAZON_SCAN_INTERVAL: "45"
      V12_LOOP_INTERVAL: "10"
      V12_VERIFY_LIMIT: "8"
      V12_REVIEW_LIMIT: "2"

    steps:
      - name: Checkout V12
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore V12 queue
        id: v12-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            .runtime_state/v12.db
            .runtime_state/v12.db-wal
            .runtime_state/v12.db-shm
            .runtime_state/v12_health.json
          key: v12-state-${{ github.run_id }}
          restore-keys: |
            v12-state-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4 playwright pillow arabic-reshaper python-bidi
          python -m playwright install --with-deps chromium

      - name: Run V12 Amazon worker
        run: |
          set +e
          PYTHONPATH=. timeout --signal=TERM 300m python scripts/run_v12.py
          code=$?

          if [ "$code" -eq 124 ] || [ "$code" -eq 143 ]; then
            echo "✅ V12 worker window completed normally"
            exit 0
          fi

          exit "$code"

      - name: Save V12 queue
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .runtime_state/v12.db
            .runtime_state/v12.db-wal
            .runtime_state/v12.db-shm
            .runtime_state/v12_health.json
          key: v12-state-${{ github.run_id }}
