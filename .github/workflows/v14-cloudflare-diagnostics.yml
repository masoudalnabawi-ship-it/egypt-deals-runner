name: V14 Cloudflare Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout V14
        uses: actions/checkout@v4
        with:
          ref: v14-cloudflare

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --no-save wrangler@4

      - name: Capture V14 error during one verification claim
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUD_API_KEY }}
          V14_GITHUB_PIPELINE_KEY: ${{ secrets.V14_GITHUB_PIPELINE_KEY }}
        run: |
          set -eu
          timeout 65s npx wrangler tail egypt-amazon-v14 --format json --status error > /tmp/v14-tail.log 2>&1 &
          TAIL_PID=$!
          trap 'kill "$TAIL_PID" 2>/dev/null || true' EXIT
          sleep 15
          curl --silent --show-error --max-time 25 \
            --output /tmp/v14-response.txt \
            --write-out 'CLAIM_HTTP_STATUS:%{http_code}\n' \
            -X POST 'https://egypt-amazon-v14.masoud-amazon-eg.workers.dev/admin/playwright-verify/claim' \
            -H "Authorization: Bearer $V14_GITHUB_PIPELINE_KEY" \
            -H 'Content-Type: application/json' \
            --data '{"worker_id":"v14-diagnostic-once"}' || true
          sleep 8
          echo '=== CLOUDFLARE ERRORS ==='
          cat /tmp/v14-tail.log

      # V14_ULTRA_HEALTH_CHECK
      - name: Check V14 Ultra database
        if: ${{ false }}
        env:
          V14_GITHUB_PIPELINE_KEY: ${{ secrets.V14_GITHUB_PIPELINE_KEY }}
        run: |
          python - <<'PYTHON'
          import json, os, urllib.request, urllib.error

          url = "https://egypt-amazon-v14.masoud-amazon-eg.workers.dev/admin/ultra-health"
          key = os.environ["V14_GITHUB_PIPELINE_KEY"]

          req = urllib.request.Request(
              url,
              headers={"Authorization": "Bearer " + key}
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.load(r)
                  print(json.dumps(data, ensure_ascii=False, indent=2))
          except urllib.error.HTTPError as e:
              print("ULTRA_HEALTH_HTTP_STATUS:", e.code)
              print(e.read().decode()[:1000])
              raise
          PYTHON

      # V14_DIRECT_D1_DIAGNOSTIC
      - name: Inspect V14 D1 directly
        working-directory: cloudflare_amazon_v14
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "=== AMAZON DEALS LAST 24 HOURS ==="
          npx wrangler d1 execute egypt-amazon-v14-db --remote --command "SELECT lane,state,COUNT(*) AS total,MAX(discovered_at) AS latest FROM deals WHERE store='amazon' AND discovered_at >= CAST(strftime('%s','now') AS INTEGER)-86400 GROUP BY lane,state;"

          echo "=== AMAZON EVENTS LAST 24 HOURS ==="
          npx wrangler d1 execute egypt-amazon-v14-db --remote --command "SELECT event,COUNT(*) AS total,MAX(ts) AS latest FROM events WHERE store='amazon' AND ts >= CAST(strftime('%s','now') AS INTEGER)-86400 GROUP BY event ORDER BY total DESC LIMIT 30;"

          echo "=== ALL AMAZON DEAL STATES ==="
          npx wrangler d1 execute egypt-amazon-v14-db --remote --command "SELECT lane,state,COUNT(*) AS total FROM deals WHERE store='amazon' GROUP BY lane,state;"
